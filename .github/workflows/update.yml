
name: Artikelen bijwerken

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artikelen-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund

      - name: Artikelen controleren zonder publiceren
        env:
          SYNC_PUBLISH: "false"
        run: node scripts/sync.mjs
