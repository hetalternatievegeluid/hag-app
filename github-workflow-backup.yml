name: Back-up maken

on:
  schedule:
    - cron: "30 3 * * 0"   # elke zondag om 03:30 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikelen
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Back-up ophalen
        env:
          WW: ${{ secrets.BEHEER_WACHTWOORD }}
          SITE: ${{ vars.SITE_URL }}
        run: |
          mkdir -p backups
          curl -sSf --max-time 120 -H "x-beheer: $WW" "$SITE/api/backup" -o "backups/backup-$(date +%Y-%m-%d).json"
          ls -1t backups/backup-*.json | tail -n +13 | xargs -r rm -f
      - name: Opslaan
        run: |
          git config user.name "hag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backups
          git diff --cached --quiet || (git commit -m "Wekelijkse back-up" && git push)
