<style>
:root{
  --bg:#F2F2F3; --surface:#FFFFFF; --ink:#16171C; --muted:#5D5F68; --line:#D9DADE;
  --accent:#C62A21; --accent-soft:#FBE7E5; --focus:#C62A21; --bar:#16171C; --bar-ink:#FFFFFF;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171C; --surface:#1F2027; --ink:#F2F2F3; --muted:#A3A5AE; --line:#2D2F38;
    --accent:#E8463B; --accent-soft:#2F1B1B; --focus:#E8463B; --bar:#0C0D10; --bar-ink:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16171C; --surface:#1F2027; --ink:#F2F2F3; --muted:#A3A5AE; --line:#2D2F38;
  --accent:#E8463B; --accent-soft:#2F1B1B; --focus:#E8463B; --bar:#0C0D10; --bar-ink:#FFFFFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--accent)}
.bar .brand{padding:12px 0}
.brand a.home{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--bar-ink)}
.brand img{width:40px;height:40px;flex:none}
.brand p{color:#B9BBC3}
.tools{padding-top:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px}
.brand h1{font-family:var(--serif);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin:0}
.brand h1 a{text-decoration:none}
.brand p{margin:0;color:var(--muted);font-size:.82rem}
.tools{display:flex;gap:10px;align-items:center;padding-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.95rem;padding:9px 0;min-width:0}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--focus)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.9rem;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:#fff}
.tab .n{font-size:.75rem;opacity:.7;margin-left:4px}

/* hero */
.hero{padding:34px 0 30px;border-bottom:1px solid var(--line)}
.hero .cat{background:var(--accent);color:#fff;padding:3px 10px;border-radius:999px}
.hero .meta{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.hero h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.9rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 18px;max-width:20ch}
.hero h2 a{text-decoration:none}
.hero h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.hero .lead{font-family:var(--serif);font-weight:600;font-size:1.18rem;line-height:1.6;margin:0 0 20px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:.92rem;padding:10px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}

/* timeline list */
.month{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--muted);margin:30px 0 6px;padding-left:76px}
ol.feed{list-style:none;margin:0;padding:0;position:relative}
ol.feed::before{content:"";position:absolute;left:61px;top:6px;bottom:6px;width:1px;background:var(--line)}
.item{display:grid;grid-template-columns:52px 1fr;gap:24px;padding:14px 0;position:relative}
.item::before{content:"";position:absolute;left:58px;top:24px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted)}
.item.saved::before{background:var(--accent);border-color:var(--accent)}
.item time{text-align:right;font-size:.8rem;line-height:1.25;color:var(--muted);padding-top:4px}
.item time b{display:block;font-family:var(--serif);font-size:1.45rem;font-weight:600;color:var(--ink);line-height:1}
.cat{display:inline-block;font-size:.76rem;font-weight:600;color:var(--accent);margin-bottom:3px}
.series{font-size:.76rem;color:var(--muted);font-weight:500}
.item h3{font-family:var(--serif);font-weight:600;font-size:1.28rem;line-height:1.22;margin:0 0 6px;letter-spacing:-.01em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.item p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:64ch}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--serif);font-size:1.25rem;color:var(--ink);margin-bottom:6px}

/* reader */
.reader{padding:22px 0 60px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;padding:6px 0;margin-bottom:22px}
.reader .meta{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.reader .meta .cat{margin:0 8px 0 0}
.reader h1{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,6.5vw,3rem);line-height:1.06;letter-spacing:-.02em;margin:0 0 22px}
.seriesnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 26px}
.seriesnav a{padding:4px 11px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink)}
.seriesnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reader .lead{font-family:var(--serif);font-weight:600;font-size:1.22rem;line-height:1.62;margin:0 0 30px;max-width:64ch}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:14px 16px;font-size:.9rem;margin:0 0 26px;max-width:64ch}
.note p{margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.body{font-family:var(--serif);font-size:1.12rem;line-height:1.7;max-width:64ch;overflow-wrap:break-word}
.body p{margin:0 0 1.1em}
.body h2,.body h3,.body h4{font-family:var(--serif);font-weight:700;line-height:1.25;margin:1.7em 0 .5em}
.body h2{font-size:1.45rem}.body h3{font-size:1.2rem}
.body img{max-width:100%;height:auto;border-radius:4px;display:block;margin:1.2em 0}
.body figure{margin:1.4em 0}.body figcaption{font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.body a{color:var(--accent)}
.body blockquote{border-left:3px solid var(--accent);margin:1.3em 0;padding:.1em 0 .1em 1em}
.body ul,.body ol{padding-left:1.3em}
.body hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.ticker{display:flex;align-items:stretch;background:var(--bar);color:#E9EAEE;border-bottom:1px solid #000;font-size:.86rem;height:34px;overflow:hidden}
.tlabel{flex:none;display:flex;align-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:0 12px}
.tvenster{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tband{display:inline-flex;align-items:center;height:34px;white-space:nowrap;animation:tick 120s linear infinite;will-change:transform}
.tkopie{display:inline-flex;align-items:center}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker:hover .tband,.ticker:focus-within .tband,.ticker.gepauzeerd .tband{animation-play-state:paused}
.titem{color:#E9EAEE;text-decoration:none;padding:0 4px}
.titem b{font-weight:700;color:#fff;margin-right:4px}
.titem.flits b{color:#fff;background:var(--accent);border-radius:3px;padding:0 5px;text-transform:uppercase;font-size:.72rem;letter-spacing:.04em}
.titem:hover{text-decoration:underline}
.tsep{color:var(--accent);padding:0 10px}
.tpauze{flex:none;background:none;border:0;border-left:1px solid #2D2F38;color:#9EA1AB;width:36px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tpauze[aria-pressed="true"]{color:var(--accent)}
@media (prefers-reduced-motion: reduce){
  .tband{animation:none}
  .tvenster{overflow-x:auto;scrollbar-width:none;mask-image:none;-webkit-mask-image:none}
  .tkopie{display:none}
  .tpauze{display:none}
}
.stand{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;margin:18px 0 0}
.stand p{font-family:var(--serif);font-size:1.12rem;line-height:1.5;margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:18px 0 6px}
.kpi{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.ksoort{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ksoort .ind{color:var(--accent)}
.kpi strong{font-family:var(--serif);font-size:1rem;line-height:1.2}
.kwaarde{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums}
.kwaarde small,.kver small{font-size:.75rem;color:var(--muted);font-weight:400}
.kver{font-size:.85rem;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.pct.up{color:var(--accent)}
.pct.down{color:#2E7D5B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pct.down{color:#4CC38A}}
.grafiek{margin:6px 0 2px;min-height:220px}
.grafiek svg{display:block;touch-action:pan-y}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.legenda i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}
.bew{border-top:1px solid var(--line);padding:14px 0;transition:background .4s}
.bew.flash{background:var(--accent-soft)}
.bew .nmeta{font-size:.85rem}
.duiding{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:8px 0}
.duiding p{margin:2px 0 0;font-family:var(--serif);font-size:1.02rem}
.newslist.compact .news{padding:8px 0}
.newslist.compact .ntitle{font-size:.98rem}
.opbouw{margin:26px 0 0;border-top:1px solid var(--line);padding-top:14px}
.opbouw summary{font-family:var(--serif);font-weight:600;font-size:1.1rem;cursor:pointer}
.opbouw p{max-width:64ch;line-height:1.6}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px}
.rcard{display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:0 0 6px 6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.rcard:hover{border-color:var(--accent)}
.rcard strong{font-family:var(--serif);font-size:1.15rem}
.romschr{font-size:.85rem;color:var(--muted)}
.redlbl{font-size:.7rem;font-weight:700;background:var(--accent);color:#fff;border-radius:4px;padding:0 6px}
ul.rlist li.isred{border-left:3px solid var(--accent);padding-left:12px}
ul.rlist li.flash{background:var(--accent-soft)}
ul.rlist li{transition:background .4s}
.macties{margin-left:auto;display:flex;gap:10px}
.antw{background:none;border:0;color:var(--accent);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;padding:0}
.macties .meld{margin-left:0}
.citaat{display:block;width:100%;text-align:left;background:var(--bg);border:0;border-left:3px solid var(--line);border-radius:0 4px 4px 0;padding:6px 10px;margin:6px 0 2px;font:inherit;font-size:.84rem;color:var(--muted);cursor:pointer}
.citaat b{color:var(--ink)}
#antwoordbalk{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;margin:10px 0 0;font-size:.86rem}
.heroimg{display:block;margin:0 0 18px;border-radius:8px;overflow:hidden;aspect-ratio:16/9;background:var(--line)}
.heroimg img{width:100%;height:100%;object-fit:cover;display:block}
.irow{display:flex;gap:14px;align-items:flex-start}
.irow>div{flex:1;min-width:0}
.thumb{flex:none;width:92px;height:92px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:4px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:520px){.thumb{width:72px;height:72px}}
.readimg{margin:0 0 26px}
.readimg img{width:100%;max-height:440px;object-fit:cover;border-radius:8px;display:block}
.news.heeftbeeld{display:grid;grid-template-columns:1fr 76px;column-gap:12px}
.news.heeftbeeld>*{grid-column:1}
.nthumb{grid-column:2!important;grid-row:1 / span 4;width:76px;height:76px;object-fit:cover;border-radius:6px;background:var(--line)}
.nplaats{display:inline-block;margin-top:4px;font-size:.74rem;color:var(--muted)}
.nplaats::before{content:"● ";color:var(--accent)}
.periode{margin-top:0}
.bolvak{position:relative;display:flex;justify-content:center;margin:10px 0 6px}
.bolvak canvas{cursor:grab;max-width:100%;touch-action:none}
.bolvak canvas:active{cursor:grabbing}
.bolstatus{position:absolute;inset:auto 0 45% 0;text-align:center;color:var(--muted);font-size:.9rem;margin:0;pointer-events:none}
.plekchips{display:flex;gap:6px;flex-wrap:wrap}
.plekchips .n{font-size:.75rem;opacity:.7;margin-left:2px}
.flitsen{padding:22px 0 18px;border-bottom:1px solid var(--line)}
.flitsen h2{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:1.15rem;margin:0 0 12px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,42,33,.55)}70%{box-shadow:0 0 0 9px rgba(198,42,33,0)}100%{box-shadow:0 0 0 0 rgba(198,42,33,0)}}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.fcard:hover{border-color:var(--accent)}
.fcard strong{font-family:var(--serif);font-size:1.12rem;line-height:1.25}
.ftag{font-size:.74rem;font-weight:700;letter-spacing:.02em;color:var(--accent);text-transform:uppercase}
.flast{font-size:.86rem;color:var(--ink)}
.flast b{font-variant-numeric:tabular-nums;margin-right:4px}
.fmeta{font-size:.78rem;color:var(--muted)}
.flits h2.kop{font-family:var(--serif);font-size:1.35rem;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.aanleiding{font-size:.9rem;color:var(--muted)}
.aanleiding a,.ubron a{color:var(--accent)}
ol.tijdlijn{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
ol.tijdlijn li{position:relative;padding:0 0 20px 6px}
ol.tijdlijn li::before{content:"";position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
ol.tijdlijn p{margin:4px 0 0;font-family:var(--serif);font-size:1.06rem;line-height:1.55;max-width:64ch}
ol.tijdlijn p.ubron{font-family:var(--sans);font-size:.82rem;color:var(--muted)}
.ulbl{font-size:.74rem;font-weight:700;border-radius:4px;padding:0 6px}
.ulbl.bevestigd{background:var(--ink);color:var(--bg)}
.ulbl.claim{border:1px solid var(--accent);color:var(--accent)}
.ulbl.onbevestigd{border:1px dashed var(--muted);color:var(--muted)}
.uitleg{margin-top:4px}
ul.rlist{list-style:none;margin:0 0 10px;padding:0}
ul.rlist li{padding:12px 0;border-bottom:1px solid var(--line)}
ul.rlist p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:break-word;max-width:64ch}
.meld{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:.76rem;cursor:pointer;text-decoration:underline}
.rform{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:14px}
.rform label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
.rform input,.rform textarea{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.rform textarea{min-height:100px;resize:vertical}
.rform .note{margin:12px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.privacy{margin-top:12px;font-size:.78rem}
.stroomblok{padding:26px 0 10px;border-bottom:1px solid var(--line)}
.stroomblok h2{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0 0 4px}
.stroom-intro{color:var(--muted);font-size:.85rem;margin:0 0 8px;max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul.newslist{list-style:none;margin:0;padding:0}
.news{padding:12px 0;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.nmeta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:4px}
.nmeta time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.nmeta b{color:var(--ink);font-weight:600}
.lbl{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.lbl.staat{border-color:var(--accent);color:var(--accent)}
.ntitle{font-family:var(--serif);font-size:1.08rem;font-weight:600;line-height:1.3;text-decoration:none;display:block}
.ntitle:hover{text-decoration:underline;text-underline-offset:3px}
.news p{margin:4px 0 0;font-size:.88rem;color:var(--muted);max-width:64ch}
.daykop{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--muted);margin:24px 0 2px;font-size:1rem}
.related{margin-top:48px;border-top:1px solid var(--line);padding-top:20px}
.related h2{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin:0 0 6px}
.related a{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--serif);font-size:1.08rem}
.related a span{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted)}

.dossiers{padding:26px 0 10px;border-bottom:1px solid var(--line)}
.dossiers h2{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0 0 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.dcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:0 0 6px 6px;padding:12px 14px;cursor:pointer}
.dcard:hover{border-color:var(--accent)}
.dcard strong{display:block;font-family:var(--serif);font-size:1.1rem}
.dcard span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.dcard em{display:block;font-family:var(--serif);font-style:normal;font-size:.95rem;line-height:1.35;margin-top:8px}
.dhead{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.dhead .back{margin-bottom:12px}
.dhead h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,5.5vw,2.4rem);letter-spacing:-.02em;margin:0 0 6px}
.dhead p{margin:0;color:var(--muted);font-size:.9rem}
.dhead .actions{margin-top:14px}
footer{color:var(--muted);font-size:.85rem;padding:36px 20px 44px;border-top:1px solid var(--line);margin-top:40px}
footer .vision{font-family:var(--serif);font-size:1.08rem;line-height:1.5;color:var(--ink);max-width:52ch;margin:0 0 16px}
footer .social{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 16px}
footer .social a{font-weight:600;text-decoration:none;color:var(--ink)}
footer .social a:hover{text-decoration:underline}
@media (max-width:520px){
  .brand p{display:none}
  .month{padding-left:58px}
  ol.feed::before{left:45px}
  .item{grid-template-columns:38px 1fr;gap:20px}
  .item::before{left:42px}
  .item time b{font-size:1.25rem}
}
@media (prefers-reduced-motion:no-preference){
  .reader{animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><div class="wrap">
    <div class="brand">
      <h1><a href="#" id="home" class="home"><img src="/icons/logo.png" alt="">Het Alternatieve Geluid</a></h1>
      <p>Voor wie verder kijkt dan de krantenkop.</p>
    </div>
  </div></div>
  <div class="ticker" id="ticker" hidden>
    <span class="tlabel">Nieuws</span>
    <div class="tvenster"><div class="tband" id="tband"></div></div>
    <button class="tpauze" id="tpauze" aria-label="Nieuwsbalk pauzeren" aria-pressed="false"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" fill="currentColor"/><rect x="7" y="1" width="3" height="10" fill="currentColor"/></svg></button>
  </div>
  <div class="wrap">
    <div class="tools" id="tools">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Zoek in artikelen" aria-label="Zoek in artikelen" autocomplete="off">
      </label>
    </div>
    <nav class="tabs" id="tabs" aria-label="Categorieën"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">
  <p class="vision">Zo bouwen we bruggen: kritisch maar open, onafhankelijk maar verbonden.</p>
  <nav class="social" aria-label="Sociale media">
    <a href="https://x.com/HetAlternatieve" target="_blank" rel="noopener">X</a>
    <a href="https://tiktok.com/@hetalternatievegeluid" target="_blank" rel="noopener">TikTok</a>
    <a href="https://youtube.com/@HetAlternatieveGeluid" target="_blank" rel="noopener">YouTube</a>
    <a href="https://instagram.com/hetalternatievegeluid" target="_blank" rel="noopener">Instagram</a>
    <a href="https://hetalternatievegeluid.substack.com/" target="_blank" rel="noopener">Substack</a>
  </nav>
  <p>Contact: <a href="mailto:hetalternatievegeluid@gmail.com">hetalternatievegeluid@gmail.com</a></p>
  <p id="updated"></p>
  <p>© 2024–2026 Het Alternatieve Geluid</p>
</footer>

<script>
const SITE = "https://www.hetalternatievegeluid.nl";
const CATS = [
  {id:"alles", name:"Alles"},
  {id:"stroom", name:"Nieuwsstroom"},
  {id:"wereld", name:"Wereldbol"},
  {id:"energie", name:"Energie"},
  {id:"gesprek", name:"Gesprekken"},
  {id:"nieuws", name:"Nieuws"},
  {id:"onderzoek", name:"Onderzoek"},
  {id:"analyse", name:"Analyse"},
  {id:"anderekijk", name:"Een Andere Kijk"},
  {id:"bewaard", name:"Bewaard"}
];
const CATNAME = {nieuws:"Nieuws", onderzoek:"Onderzoek", analyse:"Analyse", anderekijk:"Een Andere Kijk"};
const RUBRIEK = {nieuws:"Nieuws Artikel", onderzoek:"Onderzoeks Artikel", analyse:"Analyse Artikel", anderekijk:"Een Andere Kijk"};
let DOSSIERS = [];
const rubriekShort = a => a.deel ? `Een Andere Kijk: Deel ${a.deel}` : RUBRIEK[a.cat];
const rubriekFull = a => a.deel ? rubriekShort(a) : `${RUBRIEK[a.cat]}: ${numDate(new Date(a.date))}`;
const fmtShort = new Intl.DateTimeFormat("nl-NL",{day:"numeric",month:"long"});
const numDate = d => `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
let followed = new Set();
try { followed = new Set(JSON.parse(localStorage.getItem("hag-follow") || "[]")); } catch(e) {}
function persistFollow(){ try { localStorage.setItem("hag-follow", JSON.stringify([...followed])); } catch(e) {} }
function dossierLine(a){
  const ds = DOSSIERS.filter(d=>d.ids.includes(a.id));
  return ds.length ? `<nav class="seriesnav" aria-label="Dossiers">Dossier: ${ds.map(d=>`<a href="#" data-act="dossier" data-id="${d.id}">${esc(d.name)}</a>`).join("")}</nav>` : "";
}

let ARTICLES = [];

/* ---------- state ---------- */
const state = {cat:"alles", q:"", dossier:null, sectie:null, limit:80, periode:24, plek:null, reeks:"brent", bereik:365};
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("hag-saved") || "[]")); } catch(e) {}
function persist(){ try { localStorage.setItem("hag-saved", JSON.stringify([...saved])); } catch(e) {} }

const fmtDay = new Intl.DateTimeFormat("nl-NL",{day:"numeric"});
const fmtMon = new Intl.DateTimeFormat("nl-NL",{month:"short"});
const fmtMonth = new Intl.DateTimeFormat("nl-NL",{month:"long",year:"numeric"});
const fmtFull = new Intl.DateTimeFormat("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtTime = new Intl.DateTimeFormat("nl-NL",{hour:"2-digit",minute:"2-digit"});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sorted = [];
let UPDATED = null;
const byId = id => ARTICLES.find(a=>a.id===id);

/* ---------- tabs ---------- */
function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = CATS.map(c=>{
    const n = ["stroom","wereld","gesprek","energie"].includes(c.id) ? null : c.id==="alles" ? ARTICLES.length : c.id==="bewaard" ? saved.size : ARTICLES.filter(a=>a.cat===c.id).length;
    return `<button class="tab" data-cat="${c.id}" aria-pressed="${state.cat===c.id}">${c.name}${n===null ? "" : `<span class="n">${n}</span>`}</button>`;
  }).join("");
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  state.cat = b.dataset.cat;
  state.dossier = null; state.sectie = null; state.limit = 80;
  if(state.cat==="gesprek") RUIMTES = null;
  if(location.hash) location.hash = ""; else renderList();
  renderTabs();
});
document.getElementById("q").addEventListener("input", e=>{
  state.q = e.target.value;
  if(location.hash) location.hash = ""; else renderList();
});

/* ---------- list ---------- */
function filtered(){
  const q = norm(state.q.trim());
  return sorted.filter(a=>{
    if(state.cat==="bewaard" && !saved.has(a.id)) return false;
    if(state.dossier && !DOSSIERS.find(d=>d.id===state.dossier).ids.includes(a.id)) return false;
    if(!["alles","bewaard"].includes(state.cat) && a.cat!==state.cat) return false;
    if(q && !norm(a.title+" "+a.intro+" "+(a.series||"")).includes(q)) return false;
    return true;
  });
}
function seriesLabel(a){ return a.series ? `<span class="series">Reeks ${esc(a.series)}, deel ${a.part}</span>` : ""; }

function renderList(){
  const main = document.getElementById("main");
  document.getElementById("tools").hidden = false;
  document.getElementById("tabs").hidden = false;
  stopBol();
  if(state.cat==="stroom"){ main.innerHTML = stroomView(); return; }
  if(state.cat==="wereld"){ main.innerHTML = wereldView(); startBol(); return; }
  if(state.cat==="energie"){
    if(!PRIJZEN){ main.innerHTML = `<p class="loading">Energieprijzen laden…</p>`; laadPrijzen(); return; }
    main.innerHTML = energieView(); tekenGrafiek(); return;
  }
  if(state.cat==="gesprek"){
    if(!RUIMTES){ main.innerHTML = `<p class="loading">Gesprekken laden…</p>`; laadRuimtes(); return; }
    main.innerHTML = gesprekView(); return;
  }
  let list = filtered();
  let html = "";

  if(state.dossier){
    const ds = DOSSIERS.find(x=>x.id===state.dossier);
    const items = sorted.filter(a=>ds.ids.includes(a.id));
    const first = new Date(items[items.length-1].date), last = new Date(items[0].date);
    const f = followed.has(ds.id);
    html += `<section class="dhead">
      <button class="back" data-act="clear-dossier"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Alle artikelen</button>
      <h2>${esc(ds.name)}</h2>
      <p>${items.length} artikelen, van ${fmtShort.format(first)} tot ${fmtShort.format(last)}.</p>
      <div class="actions"><button class="btn ${f?"":"ghost"}" data-act="follow" data-id="${ds.id}" aria-pressed="${f}">${f?"Je volgt dit dossier":"Volg dit dossier"}</button></div>
    </section>
    ${stroomBlok(ds.id,5)}`;
  } else if(state.cat==="alles" && !state.q.trim()){
    const h = list[0];
    const d = new Date(h.date);
    html += flitsenBlok() + `<section class="hero">
      <p class="meta"><span class="cat">${rubriekFull(h)}</span></p>
      ${h.image ? `<a href="#artikel-${h.id}" class="heroimg"><img src="${esc(h.image)}" alt="" loading="eager" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>` : ""}
      <h2><a href="#artikel-${h.id}">${esc(h.title)}</a></h2>
      <p class="lead">${esc(h.intro)}</p>
      <a class="btn" href="#artikel-${h.id}">Lees meer »</a>
    </section>
    ${stroomBlok(null,5)}
    <section class="dossiers">
      <h2>Lopende dossiers</h2>
      <div class="dgrid">${DOSSIERS.map(ds=>{
        const latest = sorted.find(a=>ds.ids.includes(a.id));
        return `<button class="dcard" data-act="dossier" data-id="${ds.id}"><strong>${esc(ds.name)}</strong><span>${ds.ids.length} artikelen, laatst op ${fmtShort.format(new Date(latest.date))}</span><em>${esc(latest.title)}</em></button>`;
      }).join("")}</div>
    </section>
    <section class="dossiers">
      <h2>Video’s</h2>
      <p style="margin:0 0 14px;color:var(--muted);max-width:60ch">Korte infographic-video’s die je in een paar minuten bijpraten over een complex onderwerp.</p>
      <div class="actions" style="margin-bottom:18px">
        <a class="btn" href="https://tiktok.com/@hetalternatievegeluid" target="_blank" rel="noopener">Bekijk op TikTok</a>
        <a class="btn ghost" href="https://youtube.com/@HetAlternatieveGeluid" target="_blank" rel="noopener">Bekijk op YouTube</a>
      </div>
    </section>`;
    list = list.slice(1);
  }

  if(!list.length){
    let msg;
    if(state.q.trim()) msg = `<strong>Niets gevonden voor “${esc(state.q.trim())}”</strong>Probeer een ander woord, of zoek in alle categorieën.`;
    else if(state.cat==="bewaard") msg = `<strong>Nog niets bewaard</strong>Open een artikel en tik op Bewaar om het hier terug te vinden.`;
    else msg = `<strong>Nog geen artikelen in ${CATNAME[state.cat]}</strong>Kom later terug voor nieuwe stukken.`;
    main.innerHTML = html + `<div class="empty">${msg}</div>`;
    return;
  }

  let month = "", open = false;
  for(const a of list){
    const d = new Date(a.date);
    const m = fmtMonth.format(d);
    if(m!==month){
      if(open) html += `</ol>`;
      html += `<h2 class="month">${cap(m)}</h2><ol class="feed">`;
      month = m; open = true;
    }
    html += `<li class="item${saved.has(a.id)?" saved":""}">
      <time datetime="${a.date}"><b>${fmtDay.format(d)}</b>${fmtMon.format(d).replace(".","")}</time>
      <div class="irow">
        <div>
          <span class="cat">${rubriekShort(a)}</span> ${seriesLabel(a)}
          <h3><a href="#artikel-${a.id}">${esc(a.title)}</a></h3>
          ${a.intro ? `<p>${esc(a.intro)}</p>` : ""}
        </div>
        ${a.image ? `<a href="#artikel-${a.id}" class="thumb" tabindex="-1" aria-hidden="true"><img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>` : ""}
      </div>
    </li>`;
  }
  if(open) html += `</ol>`;
  main.innerHTML = html;
}

/* ---------- reader ---------- */
function renderReader(a){
  const main = document.getElementById("main");
  document.getElementById("tools").hidden = true;
  document.getElementById("tabs").hidden = true;
  const d = new Date(a.date);
  let seriesNav = "";
  if(a.series){
    const parts = sorted.filter(x=>x.series===a.series).sort((x,y)=>x.part-y.part);
    seriesNav = `<nav class="seriesnav" aria-label="Reeks">Reeks ${esc(a.series)}:
      ${parts.map(p=>`<a href="#artikel-${p.id}" ${p.id===a.id?'aria-current="page"':""}>Deel ${p.part}</a>`).join("")}</nav>`;
  }
  const others = sorted.filter(x=>x.id!==a.id && x.cat===a.cat).slice(0,3);
  const isSaved = saved.has(a.id);
  main.innerHTML = `<article class="reader">
    <button class="back" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Alle artikelen</button>
    <p class="meta"><span class="cat">${rubriekShort(a)}</span> ${cap(fmtFull.format(d))}, ${fmtTime.format(d)}</p>
    <h1>${esc(a.title)}</h1>
    ${seriesNav}
    ${dossierLine(a)}
    ${a.image && !/<img/i.test(a.html || "") ? `<figure class="readimg"><img src="${esc(a.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></figure>` : ""}
    ${a.html ? `<div class="body">${a.html}</div>` : `${a.intro ? `<p class="lead">${esc(a.intro)}</p>` : ""}<div class="note"><p>De volledige tekst van dit artikel staat (nog) niet in de app.</p></div>`}
    <div class="actions">
      <button class="btn" id="save" aria-pressed="${isSaved}">${isSaved ? "Bewaard" : "Bewaar"}</button>
      <a class="btn ghost" href="${esc(a.url)}" target="_blank" rel="noopener">${a.source==="substack" ? "Bekijk op Substack" : "Bekijk op de website"}</a>
    </div>
    ${others.length ? `<section class="related"><h2>Meer ${CATNAME[a.cat].toLowerCase()}</h2>
      ${others.map(o=>`<a href="#artikel-${o.id}"><span>${cap(fmtFull.format(new Date(o.date)))}</span>${esc(o.title)}</a>`).join("")}</section>` : ""}
  </article>`;
  document.getElementById("back").onclick = ()=>{ location.hash = ""; };
  document.getElementById("save").onclick = (e)=>{
    if(saved.has(a.id)) saved.delete(a.id); else saved.add(a.id);
    persist();
    const on = saved.has(a.id);
    e.currentTarget.textContent = on ? "Bewaard" : "Bewaar";
    e.currentTarget.setAttribute("aria-pressed", on);
    renderTabs();
  };
  window.scrollTo(0,0);
}

/* ---------- nieuwsstroom ---------- */
let NIEUWS = null;
async function loadNieuws(){
  try {
    const r = await fetch("/api/nieuws", {cache:"no-cache"});
    if(!r.ok) throw new Error(r.status);
    NIEUWS = await r.json();
  } catch(e) {
    if(!NIEUWS) NIEUWS = {fout:true, berichten:[], secties:[]};
  }
  updateTicker();
  if(!location.hash && ARTICLES.length) renderList();
}
function nTijd(iso){
  const d = new Date(iso), nu = new Date(), dag = x => x.toDateString();
  const t = fmtTime.format(d);
  if(dag(d)===dag(nu)) return t;
  const gister = new Date(nu); gister.setDate(nu.getDate()-1);
  if(dag(d)===dag(gister)) return "gisteren " + t;
  return fmtShort.format(d) + " " + t;
}
function newsItem(b, alleenTijd){
  const d = new Date(b.tijd);
  return `<li class="news${b.beeld ? " heeftbeeld" : ""}">${b.beeld ? `<img class="nthumb" src="${esc(b.beeld)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<div class="nmeta"><time datetime="${esc(b.tijd)}">${alleenTijd ? fmtTime.format(d) : nTijd(b.tijd)}</time><b>${esc(b.bron)}</b><span class="lbl${b.staat ? " staat" : ""}">${esc(b.label)}</span></div><a class="ntitle" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.titel)}</a>${b.samenvatting ? `<p>${esc(b.samenvatting)}</p>` : ""}${b.plaats ? `<span class="nplaats">${esc(b.plaats.naam)}</span>` : ""}</li>`;
}
function stroomBlok(sectie, n){
  if(!NIEUWS) return `<section class="stroomblok"><h2>Nieuwsstroom</h2><p class="stroom-intro">Laden…</p></section>`;
  const lijst = NIEUWS.berichten.filter(b => !sectie || b.secties.includes(sectie)).slice(0, n);
  if(!lijst.length) return "";
  const naam = sectie ? (NIEUWS.secties.find(s => s.id===sectie) || {}).naam : "";
  return `<section class="stroomblok"><h2>Nieuwsstroom${naam ? ": " + esc(naam) : ""}</h2>
    <p class="stroom-intro">Koppen uit andere media, automatisch verzameld en niet door ons gecontroleerd.</p>
    <ul class="newslist">${lijst.map(b => newsItem(b, false)).join("")}</ul>
    <p><button class="btn ghost" data-act="stroom" data-id="${sectie || ""}">Hele nieuwsstroom</button></p></section>`;
}
function stroomView(){
  if(!NIEUWS) return `<p class="loading">Nieuwsstroom laden…</p>`;
  let html = `<section class="dhead"><h2>Nieuwsstroom</h2><p>Koppen uit andere media, elk kwartier automatisch verzameld. Deze berichten zijn niet door Het Alternatieve Geluid gecontroleerd. Bij elk bericht staat wie het meldt en wat voor bron dat is; staatsmedia zijn rood gemarkeerd.</p></section>`;
  if(NIEUWS.fout && !NIEUWS.berichten.length) return html + `<div class="empty"><strong>De nieuwsstroom is nu niet bereikbaar</strong>Probeer het over een paar minuten opnieuw.</div>`;
  html += `<div class="chips">` + [{id:"", naam:"Alles"}, ...NIEUWS.secties].map(s => `<button class="chip" data-act="sectie" data-id="${s.id}" aria-pressed="${(state.sectie || "")===s.id}">${esc(s.naam)}</button>`).join("") + `</div>`;
  const q = norm(state.q.trim());
  const lijst = NIEUWS.berichten.filter(b => (!state.sectie || b.secties.includes(state.sectie)) && (!q || norm(b.titel + " " + b.samenvatting + " " + b.bron).includes(q)));
  if(!lijst.length) return html + `<div class="empty"><strong>Geen berichten gevonden</strong>Kies een andere sectie of zoekterm.</div>`;
  const toon = lijst.slice(0, state.limit);
  let dag = "";
  html += toon.map(b => {
    const k = cap(fmtFull.format(new Date(b.tijd)));
    let pre = "";
    if(k!==dag){ pre = (dag ? `</ul>` : "") + `<h3 class="daykop">${k}</h3><ul class="newslist">`; dag = k; }
    return pre + newsItem(b, true);
  }).join("") + `</ul>`;
  if(lijst.length > toon.length) html += `<p><button class="btn ghost" data-act="meer">Meer laden</button></p>`;
  html += `<p class="stroom-intro">Bijgewerkt om ${fmtTime.format(new Date(NIEUWS.bijgewerkt))}.</p>`;
  return html;
}

/* ---------- flitsen ---------- */
let FLITSEN = [], flitsTimer = null;
const ULABEL = {bevestigd:"Bevestigd", claim:"Claim", onbevestigd:"Onbevestigd"};
const sectieNaam = id => (NIEUWS?.secties || []).find(s=>s.id===id)?.naam || (DOSSIERS.find(d=>d.id===id)||{}).name || "";
async function loadFlitsen(){
  try { const r = await fetch("/api/flitsen", {cache:"no-cache"}); if(r.ok) FLITSEN = (await r.json()).flitsen || []; } catch(e) {}
  updateTicker();
  if(!location.hash && ARTICLES.length) renderList();
}
function flitsenBlok(){
  const actief = FLITSEN.filter(f=>f.status==="actief");
  if(!actief.length) return "";
  return `<section class="flitsen"><h2><span class="pulse" aria-hidden="true"></span>Flitsen</h2>

const BIB = {

  topo: "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js",
  land: "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json"
};
let bol = null, LAND = null;
function laadScript(src){ return new Promise((ok, nee) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = nee; document.head.appendChild(s); }); }
async function laadBolBibliotheken(){
  if(!window.d3) await laadScript(BIB.d3);
  if(!window.topojson) await laadScript(BIB.topo);
  if(!LAND){ const w = await (await fetch(BIB.land)).json(); LAND = topojson.feature(w, w.objects.countries); }
}
function bolBerichten(){
  if(!NIEUWS) return [];
  const grens = Date.now() - state.periode * 36e5;
  return NIEUWS.berichten.filter(b => b.plaats && new Date(b.tijd).getTime() > grens && (!state.sectie || b.secties.includes(state.sectie)));
}
function bolPlekken(){
  const m = new Map();
  for(const b of bolBerichten()){
    const k = b.plaats.naam;
    if(!m.has(k)) m.set(k, {naam:k, lat:b.plaats.lat, lon:b.plaats.lon, berichten:[], nieuwste:0});
    const p = m.get(k); p.berichten.push(b); p.nieuwste = Math.max(p.nieuwste, new Date(b.tijd).getTime());
  }
  return [...m.values()].sort((a,b) => b.berichten.length - a.berichten.length);
}
function wereldView(){
  const per = [[6,"6 uur"],[24,"24 uur"],[72,"3 dagen"],[168,"7 dagen"]];
  return `<section class="dhead"><h2>Wereldbol</h2><p>Waar het nieuws van dit moment over gaat. Elke stip is een plaats die in de koppen van de nieuwsstroom wordt genoemd; hoe groter de stip, hoe meer berichten. Sleep om te draaien, tik op een stip voor de berichten.</p></section>
    <div class="chips">${[{id:"", naam:"Alles"}, ...(NIEUWS?.secties || [])].map(s => `<button class="chip" data-act="sectie" data-id="${s.id}" aria-pressed="${(state.sectie || "")===s.id}">${esc(s.naam)}</button>`).join("")}</div>

    <div class="bolvak"><canvas id="bol" aria-label="Draaibare wereldbol met nieuwslocaties" role="img"></canvas><p class="bolstatus" id="bolstatus">Wereldbol laden…</p></div>
    <div id="pleklijst"></div>`;
}
async function startBol(){
  try { await laadBolBibliotheken(); }
  catch(e){ const st = document.getElementById("bolstatus"); if(st) st.textContent = "De wereldbol kon niet worden geladen. Controleer je verbinding."; return; }
  const canvas = document.getElementById("bol"); if(!canvas) return;
  document.getElementById("bolstatus").textContent = "";
  const css = getComputedStyle(document.documentElement);
  const kleur = n => css.getPropertyValue(n).trim();
  const plekken = bolPlekken();
  const maat = () => Math.min(canvas.parentNode.clientWidth, 560);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = maat();
  canvas.width = w * dpr; canvas.height = w * dpr; canvas.style.width = w + "px"; canvas.style.height = w + "px";
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const proj = d3.geoOrthographic().scale(w/2 - 6).translate([w/2, w/2]).clipAngle(90);
  const start = plekken[0] ? [-plekken[0].lon, -plekken[0].lat * 0.6] : [-20, -30];
  proj.rotate([start[0], start[1], 0]);
  const pad = d3.geoPath(proj, ctx);
  const graticule = d3.geoGraticule10();
  const maxN = Math.max(1, ...plekken.map(p => p.berichten.length));
  let draait = true, laatsteActie = 0, frame = 0;
  bol = {stop:false, raf:0, plekken};
  function teken(){
    const t = performance.now();
    ctx.clearRect(0, 0, w, w);
    ctx.beginPath(); pad({type:"Sphere"}); ctx.fillStyle = kleur("--bar") || "#16171C"; ctx.fill();
    ctx.beginPath(); pad(graticule); ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = .6; ctx.stroke();
    ctx.beginPath(); pad(LAND); ctx.fillStyle = "#3A3D47"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = .5; ctx.stroke();
    const middel = [-proj.rotate()[0], -proj.rotate()[1]];
    const rood = kleur("--accent") || "#C62A21";
    for(const p of plekken){
      if(d3.geoDistance([p.lon, p.lat], middel) > Math.PI/2 - .05){ p.xy = null; continue; }
      const [x, y] = proj([p.lon, p.lat]); p.xy = [x, y];
      const r = 3 + 9 * Math.sqrt(p.berichten.length / maxN);
      p.r = r;
      if(Date.now() - p.nieuwste < 2 * 36e5){
        const fase = (t / 1600 + p.lon) % 1;
        ctx.beginPath(); ctx.arc(x, y, r + fase * 14, 0, 2*Math.PI);
        ctx.strokeStyle = `rgba(232,70,59,${(1 - fase) * .55})`; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2*Math.PI);
      ctx.fillStyle = state.plek===p.naam ? "#FFFFFF" : rood; ctx.globalAlpha = .9; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.beginPath(); pad({type:"Sphere"}); ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1; ctx.stroke();
  }
  function lus(){
    if(bol.stop) return;
    if(draait && Date.now() - laatsteActie > 4000){ const r = proj.rotate(); proj.rotate([r[0] + .12, r[1], r[2]]); }
    teken();
    bol.raf = requestAnimationFrame(lus);
  }
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce) draait = false;
  d3.select(canvas).call(d3.drag()
    .on("start", () => { laatsteActie = Date.now(); })
    .on("drag", e => { laatsteActie = Date.now(); const r = proj.rotate(), k = 75 / proj.scale(); proj.rotate([r[0] + e.dx * k, Math.max(-80, Math.min(80, r[1] - e.dy * k)), r[2]]); if(reduce) teken(); }));
  canvas.addEventListener("click", e => {
    const box = canvas.getBoundingClientRect(), x = e.clientX - box.left, y = e.clientY - box.top;
    let beste = null, afstand = 18;
    for(const p of plekken){ if(!p.xy) continue; const d = Math.hypot(p.xy[0]-x, p.xy[1]-y) - p.r; if(d < afstand){ afstand = d; beste = p; } }
    if(beste){ state.plek = beste.naam; laatsteActie = Date.now(); tekenPlekLijst(); document.getElementById("pleklijst").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"}); if(reduce) teken(); }
  });
  tekenPlekLijst();
  if(reduce) teken(); else lus();
  if(!plekken.length) document.getElementById("bolstatus").textContent = "Nog geen berichten met een plaats in deze periode.";
}
function tekenPlekLijst(){
  const box = document.getElementById("pleklijst"); if(!box || !bol) return;
  const plekken = bol.plekken;
  const gekozen = plekken.find(p => p.naam===state.plek);
  let html = `<h3 class="daykop">Meeste nieuws</h3><div class="plekchips">${plekken.slice(0,12).map(p => `<button class="chip" data-act="plek" data-id="${esc(p.naam)}" aria-pressed="${state.plek===p.naam}">${esc(p.naam)} <span class="n">${p.berichten.length}</span></button>`).join("") || `<p class="stroom-intro">Geen berichten.</p>`}</div>`;

}

      const knop = form.querySelector('button[type="submit"]'), msg = document.getElementById("rmsg"), naam = document.getElementById("rnaam").value;
      knop.disabled = true;
      try {
        const res = await fetch("/api/gesprek", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ruimte:id, naam, tekst:document.getElementById("rtekst").value, antwoordOp, website:document.getElementById("rweb").value, t:t0})});
        const j = await res.json();
        if(!res.ok) throw new Error(j.fout || "Er ging iets mis.");
        try { localStorage.setItem("hag-naam", naam); } catch(err) {}
        document.getElementById("rtekst").value = ""; zetAntwoord(null);
        msg.innerHTML = `<div class="note"><p>${j.status==="zichtbaar" ? "Je bericht staat erbij." : "Bedankt. Je bericht verschijnt zodra het is goedgekeurd."}</p></div>`;
        if(j.status==="zichtbaar") verversRuimte(id);
      } catch(err){ msg.innerHTML = `<div class="note"><p>${esc(err.message)}</p></div>`; }
      finally { knop.disabled = false; }
    };
  }
  document.getElementById("berichten").onclick = async e => {
    const a = e.target.closest("[data-antw]");
    if(a && form){ zetAntwoord(a.dataset.antw); form.scrollIntoView({behavior:"smooth", block:"start"}); document.getElementById("rtekst").focus({preventScroll:true}); return; }
    const n = e.target.closest("[data-naar]");
    if(n){ const el = document.getElementById("m-" + n.dataset.naar); if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1600); } return; }
    const b = e.target.closest("[data-meld]");
    if(b){
      if(!confirm("Dit bericht melden als ongepast?")) return;
      b.disabled = true; b.textContent = "Gemeld";
      try { await fetch("/api/gesprek", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ruimte:id, actie:"meld", id:b.dataset.meld})}); } catch(err) {}
    }
  };
  ruimteTimer = setInterval(() => verversRuimte(id), 20000);
}
async function verversRuimte(id){
  try {
    const r = await fetch(`/api/gesprek?ruimte=${encodeURIComponent(id)}`, {cache:"no-cache"}); if(!r.ok) return;
    const j = await r.json();
    if(j.berichten.length === RUIMTE_BERICHTEN.length && j.berichten.at(-1)?.id === RUIMTE_BERICHTEN.at(-1)?.id) return;
    RUIMTE_BERICHTEN = j.berichten;
    const box = document.getElementById("berichten"); if(box) box.innerHTML = berichtenHTML(RUIMTE_BERICHTEN);
  } catch(e) {}
}

/* ---------- energie ---------- */
let PRIJZEN = null;
const GRAFIEKEN = {
  brent: {naam:"Brent", reeksen:["brent"]},
  ttf: {naam:"TTF-gas", reeksen:["ttf"]},
  pomp: {naam:"Pompprijzen NL", reeksen:["diesel_nl","euro95_nl"]},
  olievspomp: {naam:"Olie vs pomp", reeksen:["diesel_nl","euro95_nl","brent_eur_l"]},
  henryhub: {naam:"Henry Hub", reeksen:["henryhub"]},
  diesel_vs: {naam:"Diesel VS", reeksen:["diesel_vs"]}
};
const KLEUREN = ["var(--accent)", "var(--ink)", "var(--muted)"];
const nf = (v, d=2) => new Intl.NumberFormat("nl-NL", {minimumFractionDigits:d, maximumFractionDigits:d}).format(v);
const decimalen = k => /_nl|brent_eur_l|diesel_vs/.test(k) ? 3 : 2;
async function laadPrijzen(){
  try { const r = await fetch("/api/prijzen", {cache:"no-cache"}); PRIJZEN = r.ok ? await r.json() : {fout:true}; }
  catch(e){ PRIJZEN = {fout:true}; }
  if(state.cat==="energie" && !location.hash) renderList();
}
function verandering(punten, dagen){
  if(!punten || punten.length < 2) return null;
  const [d, v] = punten[punten.length-1];
  const grens = new Date(d); grens.setDate(grens.getDate() - dagen);
  const g = grens.toISOString().slice(0,10);
  let ref = null; for(let i = punten.length-2; i >= 0; i--){ if(punten[i][0] <= g){ ref = punten[i]; break; } }
  if(!ref) return null;
  return (v - ref[1]) / ref[1] * 100;
}
function pctHTML(p){ if(p===null || !isFinite(p)) return ""; const c = p > 0.05 ? "up" : p < -0.05 ? "down" : ""; return `<span class="pct ${c}">${p>0?"+":""}${nf(p,1)}%</span>`; }
function energieView(){
  let html = `<section class="dhead"><h2>Energie</h2><p>Wat olie, gas en brandstof kosten, in Nederland en op de wereldmarkt, en welk nieuws er speelde rond grote prijsbewegingen.</p></section>`;
  if(PRIJZEN.fout || !PRIJZEN.reeksen) return html + `<div class="empty"><strong>De energieprijzen zijn nu niet bereikbaar</strong>Probeer het later opnieuw.</div>`;
  const P = PRIJZEN.reeksen, I = PRIJZEN.info;
  if(PRIJZEN.stand) html += `<div class="stand"><span class="ftag">Stand van de energiemarkt</span><p>${esc(PRIJZEN.stand.tekst)}</p><span class="fmeta">Duiding van de redactie${PRIJZEN.stand.tijd ? " · " + nTijd(PRIJZEN.stand.tijd) : ""}</span></div>`;
  html += `<div class="kpis">${["brent","ttf","diesel_nl","euro95_nl","henryhub","diesel_vs"].filter(k => P[k]?.length).map(k => {
    const p = P[k], [d, v] = p[p.length-1], pomp = /_nl|_vs/.test(k);
    return `<div class="kpi"><span class="ksoort">${esc(I[k].soort)}${I[k].bron?.type==="indicatief" ? ` · <span class="ind">indicatief</span>` : ""}</span>
      <strong>${esc(I[k].naam)}</strong>
      <span class="kwaarde">${nf(v, decimalen(k))} <small>${esc(I[k].eenheid)}</small></span>
      <span class="kver">${pctHTML(verandering(p, pomp ? 7 : 1))} <small>${pomp ? "week" : "dag"}</small> ${pctHTML(verandering(p, 30))} <small>maand</small></span>
      <span class="fmeta">Stand ${fmtShort.format(new Date(d))}</span></div>`;
  }).join("")}</div>`;
  html += `<h3 class="daykop">Verloop</h3>
    <div class="chips">${Object.entries(GRAFIEKEN).filter(([,g]) => g.reeksen.some(k => P[k]?.length)).map(([k,g]) => `<button class="chip" data-act="reeks" data-id="${k}" aria-pressed="${state.reeks===k}">${g.naam}</button>`).join("")}</div>
    <div class="chips periode">${[[90,"3 maanden"],[365,"1 jaar"],[730,"2 jaar"]].map(([d,t]) => `<button class="chip" data-act="bereik" data-id="${d}" aria-pressed="${state.bereik===d}">${t}</button>`).join("")}</div>
    <div class="grafiek" id="grafiek"><p class="stroom-intro">Grafiek laden…</p></div>
    <p class="stroom-intro" id="bronregel"></p>`;
  const bew = PRIJZEN.bewegingen || [];
  html += `<h3 class="daykop">Opvallende bewegingen</h3>
    <p class="stroom-intro">Dagen waarop een prijs sterk steeg of daalde, met het energienieuws uit de nieuwsstroom van rond dat moment. Dat nieuws gebeurde tegelijk, maar is niet per se de oorzaak: prijzen bewegen ook door vraag, voorraden, de dollarkoers, het weer en belastingen. Waar de redactie een duiding heeft gegeven, staat die erbij.${PRIJZEN.archiefVanaf ? ` Het nieuwsarchief loopt vanaf ${fmtShort.format(new Date(PRIJZEN.archiefVanaf))} ${new Date(PRIJZEN.archiefVanaf).getFullYear()}.` : ""}</p>
    ${bew.length ? bew.slice(0,15).map(b => `<div class="bew" id="b-${esc(b.sleutel)}">
      <div class="nmeta"><time datetime="${esc(b.datum)}">${fmtShort.format(new Date(b.datum))}</time><b>${esc(I[b.reeks]?.naam || b.reeks)}</b>${pctHTML(b.pct)}<span>van ${nf(b.van, decimalen(b.reeks))} naar ${nf(b.naar, decimalen(b.reeks))} ${esc(I[b.reeks]?.eenheid || "")}</span></div>
      ${b.duiding ? `<div class="duiding"><span class="ftag">Duiding van de redactie</span><p>${esc(b.duiding.tekst)}</p></div>` : ""}
      ${b.nieuws.length ? `<p class="fmeta">Nieuws rond dit moment</p><ul class="newslist compact">${b.nieuws.map(n => `<li class="news"><div class="nmeta"><time>${nTijd(n.tijd)}</time><b>${esc(n.bron)}</b><span class="lbl${n.staat?" staat":""}">${esc(n.label)}</span></div><a class="ntitle" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titel)}</a></li>`).join("")}</ul>` : `<p class="fmeta">Geen energienieuws in het archief rond deze datum.</p>`}
    </div>`).join("") : `<p class="stroom-intro">Geen opvallende bewegingen in de afgelopen periode.</p>`}
    <details class="opbouw"><summary>Hoe komt de pompprijs tot stand?</summary>
      <p>De prijs aan de pomp bestaat uit vier delen: de inkoop van ruwe olie, het raffineren tot benzine of diesel, transport en de marge van het tankstation, en belastingen (accijns en btw). De accijns ligt per liter vast en is een groot deel van de pompprijs. Daardoor beweegt de pompprijs procentueel minder dan de olieprijs.</p>
      <p>Een stijging van Brent komt meestal met enkele dagen tot weken vertraging aan de pomp aan. Diesel reageert daarnaast op de raffinagemarge: vallen raffinaderijen uit, bijvoorbeeld door aanvallen of sancties, dan kan diesel duurder worden terwijl ruwe olie gelijk blijft. In de grafiek “Olie vs pomp” zie je ruwe olie en de pompprijzen naast elkaar, alle drie in euro per liter.</p>
    </details>`;
  return html;
}
async function tekenGrafiek(){
  const box = document.getElementById("grafiek"); if(!box || !PRIJZEN?.reeksen) return;
  try { if(!window.d3) await laadScript(BIB.d3); } catch(e){ box.innerHTML = `<p class="stroom-intro">De grafiek kon niet worden geladen.</p>`; return; }
  const g = GRAFIEKEN[state.reeks] || GRAFIEKEN.brent;
  const grens = new Date(); grens.setDate(grens.getDate() - state.bereik);
  const gs = grens.toISOString().slice(0,10);
  const lijnen = g.reeksen.filter(k => PRIJZEN.reeksen[k]?.length).map((k,i) => ({k, kleur:KLEUREN[i], punten:PRIJZEN.reeksen[k].filter(p => p[0] >= gs).map(([d,v]) => ({d:new Date(d), v}))})).filter(l => l.punten.length);
  if(!lijnen.length){ box.innerHTML = `<p class="stroom-intro">Geen gegevens voor deze periode.</p>`; return; }
  const W = box.clientWidth || 600, H = Math.round(Math.min(340, Math.max(220, W * .55))), m = {t:12, r:12, b:26, l:46};
  const alle = lijnen.flatMap(l => l.punten);
  const x = d3.scaleTime().domain(d3.extent(alle, p => p.d)).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain(d3.extent(alle, p => p.v)).nice().range([H - m.b, m.t]);
  const eenheid = PRIJZEN.info[lijnen[0].k].eenheid;
  const svg = d3.create("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", "100%").attr("role", "img").attr("aria-label", `${g.naam} in ${eenheid}`);
  svg.append("g").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(W < 480 ? 4 : 7).tickSizeOuter(0).tickFormat(d3.timeFormat(state.bereik > 200 ? "%b %y" : "%e %b")));
  svg.append("g").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(v => nf(v, eenheid.includes("liter") ? 2 : 0)));
  svg.selectAll(".tick line").attr("stroke", "var(--line)"); svg.selectAll(".domain").attr("stroke", "var(--line)"); svg.selectAll("text").attr("fill", "var(--muted)").attr("font-size", 11);
  const lijn = d3.line().x(p => x(p.d)).y(p => y(p.v));
  for(const l of lijnen) svg.append("path").attr("d", lijn(l.punten)).attr("fill", "none").attr("stroke", l.kleur).attr("stroke-width", 2).attr("stroke-dasharray", l.k==="brent_eur_l" ? "4 3" : null);
  const bew = (PRIJZEN.bewegingen || []).filter(b => g.reeksen.includes(b.reeks) && b.datum >= gs);
  for(const b of bew){
    const cx = x(new Date(b.datum)), cy = y(b.naar);
    svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 5).attr("fill", "var(--bg)").attr("stroke", "var(--accent)").attr("stroke-width", 2).style("cursor", "pointer")
      .attr("data-act", "beweging").attr("data-id", b.sleutel).append("title").text(`${fmtShort.format(new Date(b.datum))}: ${b.pct>0?"+":""}${nf(b.pct,1)}%`);
  }
  const hulp = svg.append("g").style("display", "none");
  hulp.append("line").attr("y1", m.t).attr("y2", H - m.b).attr("stroke", "var(--muted)").attr("stroke-dasharray", "2 2");
  const tekst = hulp.append("text").attr("y", m.t + 12).attr("font-size", 12).attr("fill", "var(--ink)").attr("font-weight", 600);
  svg.append("rect").attr("x", m.l).attr("y", m.t).attr("width", W - m.l - m.r).attr("height", H - m.t - m.b).attr("fill", "transparent")
    .on("pointermove", e => {
      const [px] = d3.pointer(e); const d = x.invert(px);
      const delen = lijnen.map(l => { const i = Math.min(l.punten.length-1, d3.bisector(p => p.d).center(l.punten, d)); return `${nf(l.punten[i].v, decimalen(l.k))}`; });
      hulp.style("display", null).attr("transform", `translate(${px},0)`);
      tekst.attr("text-anchor", px > W/2 ? "end" : "start").attr("x", px > W/2 ? -6 : 6).text(`${d3.timeFormat("%e %b %Y")(d)}: ${delen.join(" / ")}`);
    })
    .on("pointerleave", () => hulp.style("display", "none"));
  svg.selectAll("circle").raise();
  box.innerHTML = "";
  if(lijnen.length > 1) box.insertAdjacentHTML("beforeend", `<div class="legenda">${lijnen.map(l => `<span><i style="background:${l.kleur}"></i>${esc(PRIJZEN.info[l.k].naam)}</span>`).join("")}</div>`);
  box.append(svg.node());
  document.getElementById("bronregel").innerHTML = `In ${esc(eenheid)}. Bron: ${[...new Set(lijnen.map(l => PRIJZEN.info[l.k].bron?.naam).filter(Boolean))].map(esc).join("; ")}. Rode rondjes zijn opvallende bewegingen; tik erop voor het nieuws van dat moment.`;
}
let grafiekTimer = null;
window.addEventListener("resize", () => { clearTimeout(grafiekTimer); grafiekTimer = setTimeout(() => { if(state.cat==="energie" && !location.hash) tekenGrafiek(); }, 250); });

/* ---------- nieuwsbalk ---------- */
let tickerSig = "";
function updateTicker(){
  const balk = document.getElementById("ticker"), band = document.getElementById("tband");
  if(!balk || !band) return;
  const flitsen = (FLITSEN || []).filter(f => f.status==="actief").map(f => ({flits:true, url:`#flits-${f.id}`, bron:"Flits", titel: f.laatste ? `${f.titel}: ${f.laatste.tekst}` : f.titel}));
  const koppen = (NIEUWS?.berichten || []).slice(0, 25).map(b => ({url:b.url, bron: b.bron + (b.staat ? " (staatsmedia)" : ""), titel:b.titel}));
  const items = [...flitsen, ...koppen];
  if(!items.length){ balk.hidden = true; return; }
  const sig = items.map(i => i.url).join("|");
  if(sig === tickerSig) return;
  tickerSig = sig;
  const html = items.map(i => `<a class="titem${i.flits ? " flits" : ""}" href="${esc(i.url)}"${i.flits ? "" : ` target="_blank" rel="noopener"`}><b>${esc(i.bron)}</b> ${esc(i.titel.length > 160 ? i.titel.slice(0,157) + "…" : i.titel)}</a><span class="tsep" aria-hidden="true">•</span>`).join("");
  band.innerHTML = html + `<span aria-hidden="true" class="tkopie">${html}</span>`;
  band.querySelectorAll(".tkopie a").forEach(a => a.tabIndex = -1);
  balk.hidden = false;
  requestAnimationFrame(() => {
    const breedte = band.scrollWidth / 2;
    band.style.animationDuration = Math.max(30, breedte / 70) + "s";
  });
}
document.getElementById("tpauze").addEventListener("click", e => {
  const b = e.currentTarget, balk = document.getElementById("ticker");
  const aan = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", aan); balk.classList.toggle("gepauzeerd", aan);
  b.setAttribute("aria-label", aan ? "Nieuwsbalk hervatten" : "Nieuwsbalk pauzeren");
});

/* ---------- routing ---------- */
function route(){
  clearInterval(flitsTimer);
  clearInterval(ruimteTimer);
  const rm = location.hash.match(/^#ruimte-([a-z0-9-]+)$/);
  if(rm){ stopBol(); renderRuimte(rm[1]); return; }
  stopBol();
  const fm = location.hash.match(/^#flits-([a-f0-9]{12})$/);
  if(fm){ renderFlits(fm[1]); return; }
  const m = location.hash.match(/^#artikel-(\d+)$/);
  const a = m && byId(m[1]);
  if(a){ renderReader(a); document.title = a.title + " | Het Alternatieve Geluid"; }
  else { renderList(); document.title = "Het Alternatieve Geluid"; }
}
document.getElementById("home").addEventListener("click", e=>{
  e.preventDefault(); state.cat="alles"; state.q=""; state.dossier=null; document.getElementById("q").value="";
  renderTabs(); if(location.hash) location.hash=""; else renderList(); window.scrollTo(0,0);
});
document.getElementById("main").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  e.preventDefault();
  const act = b.dataset.act;
  if(act==="follow"){
    if(followed.has(b.dataset.id)) followed.delete(b.dataset.id); else followed.add(b.dataset.id);
    persistFollow(); renderList(); return;
  }
  if(act==="meer"){ state.limit += 80; renderList(); return; }
  if(act==="reeks"){ state.reeks = b.dataset.id; document.querySelectorAll('[data-act="reeks"]').forEach(x=>x.setAttribute("aria-pressed", x===b)); tekenGrafiek(); return; }
  if(act==="bereik"){ state.bereik = +b.dataset.id; document.querySelectorAll('[data-act="bereik"]').forEach(x=>x.setAttribute("aria-pressed", x===b)); tekenGrafiek(); return; }
  if(act==="beweging"){ const el = document.getElementById("b-" + b.dataset.id); if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1600); } return; }
  if(act==="periode"){ state.periode = +b.dataset.id; state.plek = null; renderList(); return; }
  if(act==="plek"){ state.plek = b.dataset.id || null; tekenPlekLijst(); return; }
  if(act==="sectie"){ state.sectie = b.dataset.id || null; state.limit = 80; state.plek = null; renderList(); return; }
  if(act==="stroom"){ state.cat = "stroom"; state.sectie = b.dataset.id || null; state.dossier = null; state.limit = 80; }
  if(act==="dossier"){ state.dossier = b.dataset.id; state.cat = "alles"; state.q = ""; document.getElementById("q").value = ""; }
  if(act==="clear-dossier"){ state.dossier = null; }
  renderTabs();
  if(location.hash) location.hash = ""; else renderList();
  window.scrollTo(0,0);
});
window.addEventListener("hashchange", route);
async function load(){
  document.getElementById("main").innerHTML = `<p class="loading">Artikelen laden…</p>`;
  try {
    const res = await fetch("/data/articles.json", {cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    ARTICLES = data.articles || [];
    sorted = [...ARTICLES].sort((a,b)=> b.date.localeCompare(a.date));
    DOSSIERS = (data.dossiers || []).map(d=>({...d, ids: ARTICLES.filter(a=>(a.dossiers||[]).includes(d.id)).map(a=>a.id)})).filter(d=>d.ids.length);
    UPDATED = data.updated;
    if(UPDATED) document.getElementById("updated").textContent = "Bijgewerkt op " + fmtFull.format(new Date(UPDATED)) + " om " + fmtTime.format(new Date(UPDATED)) + ".";
    renderTabs();
    route();
  } catch(e) {
    document.getElementById("main").innerHTML = `<div class="empty"><strong>De artikelen konden niet worden geladen</strong>Controleer je internetverbinding en probeer het opnieuw.<p><button class="btn" onclick="load()">Opnieuw proberen</button></p></div>`;
  }
}
load();
loadNieuws();
loadFlitsen();
setInterval(()=>{ loadNieuws(); loadFlitsen(); }, 5*60*1000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
