<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Beheer · Het Alternatieve Geluid</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F3; --surface:#FFFFFF; --ink:#16171C; --muted:#5D5F68; --line:#D9DADE;
  --accent:#C62A21; --accent-soft:#FBE7E5; --ok:#1F7A4D; --bar:#16171C;
  --serif:"Newsreader", Georgia, serif; --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171C; --surface:#1F2027; --ink:#F2F2F3; --muted:#A3A5AE; --line:#2D2F38; --accent:#E8463B; --accent-soft:#2F1B1B; --ok:#4CC38A; --bar:#0C0D10; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{background:var(--bar);color:#fff;border-bottom:3px solid var(--accent);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.bar img{width:32px;height:32px}
.bar strong{font-family:var(--serif);font-size:1.1rem;margin-right:auto}
.bar nav{display:flex;gap:4px}
.bar nav button{background:none;border:0;color:#C9CBD2;font:inherit;font-size:.9rem;padding:6px 10px;border-radius:999px;cursor:pointer}
.bar nav button[aria-pressed="true"]{background:var(--accent);color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
main{padding:24px 0 60px}
h1{font-family:var(--serif);font-size:1.8rem;margin:0 0 6px}
h2{font-family:var(--serif);font-size:1.3rem;margin:28px 0 10px}
p.hint{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:.9rem;padding:9px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 12px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.meta{font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.actief{border-color:var(--accent);color:var(--accent)}
.labels{display:flex;gap:6px;flex-wrap:wrap}
.labels label{display:flex;align-items:center;gap:6px;font-weight:500;margin:0;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.labels input{width:auto;margin:0}
.labels label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--bg)}
.msg{padding:10px 14px;border-radius:6px;margin:12px 0;font-size:.9rem}
.msg.fout{background:var(--accent-soft);color:var(--accent)}
.msg.ok{background:var(--surface);border-left:3px solid var(--ok)}
.pick{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:6px;font:inherit;color:var(--ink);cursor:pointer}
.pick:hover{border-color:var(--accent)}
.pick small{display:block;color:var(--muted);font-size:.78rem}
.list-scroll{max-height:340px;overflow:auto;padding-right:4px}
.update{border-top:1px solid var(--line);padding:12px 0}
.update:first-child{border-top:0}
.quote{white-space:pre-wrap;margin:6px 0}
.statusregel{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.statusregel:last-child{border-bottom:0}
.statusregel .stip{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;background:var(--ok)}
.statusregel.mis .stip{background:var(--accent)}
.statusregel p{margin:2px 0 0}
.vink{display:flex;align-items:center;gap:8px;font-weight:500;margin-top:14px}
.vink input{width:auto;margin:0}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <img src="/icons/logo.png" alt="">
  <strong>Beheer</strong>
  <nav id="nav" hidden>
    <button data-view="status" aria-pressed="false">Status</button>
    <button data-view="flitsen" aria-pressed="true">Flitsen</button>
    <button data-view="gesprekken" aria-pressed="false">Gesprekken</button>
    <button data-view="agenda" aria-pressed="false">Agenda</button>
    <button data-view="uitlichten" aria-pressed="false">Uitlichten</button>
    <button data-view="energie" aria-pressed="false">Energie</button>
    <button data-view="meldingen" aria-pressed="false">Meldingen</button>
    <button data-view="moderatie" aria-pressed="false">Moderatie <span id="wachtteller"></span></button>
    <button data-view="uit" aria-pressed="false">Uitloggen</button>
  </nav>
</div></div>
<main class="wrap" id="main"></main>

<script>
const LABELS = {bevestigd:"Bevestigd", claim:"Claim", onbevestigd:"Onbevestigd"};
const CHAT = {gemodereerd:"Gemodereerd (jij keurt eerst goed)", open:"Open (direct zichtbaar, filters blijven werken)", gesloten:"Gesloten"};
let WW = "";
try { WW = sessionStorage.getItem("hag-beheer") || ""; } catch(e) {}
let SECTIES = [], STROOM = [];
const main = document.getElementById("main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => new Intl.DateTimeFormat("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));

async function api(actie, data = {}){
  const r = await fetch("/api/beheer", {method:"POST", headers:{"content-type":"application/json","x-beheer":WW}, body:JSON.stringify({actie, ...data})});
  const j = await r.json().catch(()=>({fout:"Onverwachte fout"}));
  if(!r.ok) throw new Error(j.fout || "Er ging iets mis");
  return j;
}
function melding(el, tekst, soort="ok"){ el.innerHTML = `<div class="msg ${soort}">${esc(tekst)}</div>`; }

/* ---------- inloggen ---------- */
function toonLogin(fout){
  document.getElementById("nav").hidden = true;
  main.innerHTML = `<h1>Inloggen</h1><p class="hint">Gebruik het wachtwoord dat je in Netlify hebt ingesteld als BEHEER_WACHTWOORD.</p>
    <div class="card"><label for="ww">Wachtwoord</label><input id="ww" type="password" autocomplete="current-password">
    <div class="actions"><button class="btn" id="login">Inloggen</button></div><div id="lmsg"></div></div>`;
  if(fout) melding(document.getElementById("lmsg"), fout, "fout");
  const go = async () => {
    WW = document.getElementById("ww").value;
    try { await api("controle"); try{ sessionStorage.setItem("hag-beheer", WW); }catch(e){} start(); }
    catch(e){ melding(document.getElementById("lmsg"), e.message, "fout"); }
  };
  document.getElementById("login").onclick = go;
  document.getElementById("ww").onkeydown = e => { if(e.key==="Enter") go(); };
}

/* ---------- navigatie ---------- */
document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.view==="uit"){ WW=""; try{ sessionStorage.removeItem("hag-beheer"); }catch(e){} toonLogin(); return; }
  kies(b.dataset.view);
});
function kies(view){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===view));
  main.onclick = null; main.onchange = null;
  if(view==="moderatie") toonModeratie(); else if(view==="gesprekken") toonGesprekken(); else if(view==="energie") toonEnergie(); else if(view==="agenda") toonAgenda(); else if(view==="meldingen") toonMeldingen(); else if(view==="status") toonStatus(); else if(view==="uitlichten") toonUitlichten(); else toonFlitsen();
}

/* ---------- flitsen-overzicht ---------- */
async function toonFlitsen(){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    const {flitsen} = await api("lijst");
    main.innerHTML = `<h1>Flitsen</h1><p class="hint">Grote ontwikkelingen die je volgt. Actieve flitsen staan bovenaan de app.</p>
      <div class="actions" style="margin:0 0 18px"><button class="btn" id="nieuw">Nieuwe flits</button></div>
      ${flitsen.length ? flitsen.map(f=>`<div class="card">
        <span class="tag ${f.status==="actief"?"actief":""}">${f.status==="actief"?"Actief":"Archief"}</span><span class="tag">Gesprek: ${esc(f.chat||"gemodereerd")}</span>
        <h2 style="margin:8px 0 4px">${esc(f.titel)}</h2>
        <p class="meta">${f.updates} updates · bijgewerkt ${fmt(f.bijgewerkt)}</p>
        <div class="actions"><button class="btn small" data-open="${f.id}">Openen</button><a class="btn ghost small" href="/#flits-${f.id}" target="_blank">Bekijk in app</a></div>
      </div>`).join("") : `<div class="card"><p class="hint" style="margin:0">Nog geen flitsen. Maak er een aan vanuit een kop in de nieuwsstroom, of vanaf nul.</p></div>`}`;
    document.getElementById("nieuw").onclick = () => toonEditor(null);
    main.querySelectorAll("[data-open]").forEach(b=> b.onclick = () => toonEditor(b.dataset.open));
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- flits bewerken ---------- */
async function toonEditor(id){
  let f = {titel:"", context:"", sectie:SECTIES[0]?.id || "", bron:{naam:"",url:"",label:""}, community:"", status:"actief", chat:"gemodereerd", updates:[]};
  if(id){ try { f = await api("lees", {id}); } catch(e){ melding(main, e.message, "fout"); return; } }
  const sectieOpties = SECTIES.map(s=>`<option value="${esc(s.id)}" ${s.id===f.sectie?"selected":""}>${esc(s.naam)}</option>`).join("");
  main.innerHTML = `<button class="btn ghost small" id="terug">← Alle flitsen</button>
    <h1 style="margin-top:14px">${id ? "Flits bewerken" : "Nieuwe flits"}</h1>
    ${!id && STROOM.length ? `<div class="card"><strong>Kies een kop uit de nieuwsstroom</strong><p class="hint">Of vul hieronder alles zelf in.</p>
      <input id="zoek" placeholder="Zoek in de nieuwsstroom" style="margin-bottom:10px"><div class="list-scroll" id="stroomlijst"></div></div>` : ""}
    <div class="card">
      <label for="titel">Titel</label><input id="titel" value="${esc(f.titel)}" maxlength="200">
      <label for="context">Context (een paar zinnen van jou: wat is er aan de hand en waarom volg je dit)</label><textarea id="context" maxlength="2000">${esc(f.context)}</textarea>
      <div class="row">
        <div><label for="sectie">Sectie</label><select id="sectie">${sectieOpties}</select></div>
        <div><label for="community">Link naar de community (Substack-chat of Telegram, optioneel)</label><input id="community" value="${esc(f.community)}" placeholder="https://"></div>
      </div>
      <div class="row">
        <div><label for="bnaam">Aanleiding: bron</label><input id="bnaam" value="${esc(f.bron?.naam)}"></div>
        <div><label for="blabel">Soort bron</label><input id="blabel" value="${esc(f.bron?.label)}" placeholder="bijv. Westerse mainstream media"></div>
      </div>
      <label for="burl">Link naar het bronbericht</label><input id="burl" value="${esc(f.bron?.url)}" placeholder="https://">
      <div class="row">
        <div><label for="status">Status</label><select id="status"><option value="actief" ${f.status==="actief"?"selected":""}>Actief (staat bovenaan de app)</option><option value="archief" ${f.status==="archief"?"selected":""}>Archief</option></select></div>
        <div><label for="chat">Gesprek</label><select id="chat">${Object.entries(CHAT).map(([k,v])=>`<option value="${k}" ${f.chat===k?"selected":""}>${v}</option>`).join("")}</select></div>
      </div>
      ${id ? "" : `<label class="vink"><input type="checkbox" id="fpush" checked> Pushmelding sturen naar wie deze sectie volgt</label>`}
      <div class="actions"><button class="btn" id="bewaar">${id ? "Opslaan" : "Flits aanmaken"}</button>${id ? `<a class="btn ghost" href="/#flits-${id}" target="_blank">Bekijk in app</a><button class="btn ghost" id="weg">Verwijderen</button>` : ""}</div>
      <div id="fmsg"></div>
    </div>
    ${id ? `<h2>Nieuwe update</h2>
    <div class="card">
      <label for="utekst">Wat is er gebeurd?</label><textarea id="utekst" maxlength="1500"></textarea>
      <label>Label</label><div class="labels">${Object.entries(LABELS).map(([k,v],i)=>`<label><input type="radio" name="ulabel" value="${k}" ${i===2?"checked":""}>${v}</label>`).join("")}</div>
      <div class="row"><div><label for="ubnaam">Bron</label><input id="ubnaam"></div><div><label for="uburl">Link</label><input id="uburl" placeholder="https://"></div></div>
      <label class="vink"><input type="checkbox" id="upush" checked> Pushmelding sturen naar wie deze sectie volgt</label>
      <div class="actions"><button class="btn" id="plaats">Update plaatsen</button></div><div id="umsg"></div>
    </div>
    <h2>Tijdlijn</h2><div class="card" id="tijdlijn">${tijdlijnHTML(f)}</div>` : ""}`;

  document.getElementById("terug").onclick = () => kies("flitsen");
  const lees = () => ({ id, titel:val("titel"), context:val("context"), sectie:val("sectie"), community:val("community"), status:val("status"), chat:val("chat"), bron:{naam:val("bnaam"), url:val("burl"), label:val("blabel")} });
  document.getElementById("bewaar").onclick = async () => {
    try { const n = await api("opslaan", {...lees(), push: !id && document.getElementById("fpush")?.checked}); if(!id) toonEditor(n.id); else melding(document.getElementById("fmsg"), "Opgeslagen."); }
    catch(e){ melding(document.getElementById("fmsg"), e.message, "fout"); }
  };
  if(id){
    document.getElementById("weg").onclick = async () => {
      if(!confirm("Deze flits met alle updates en reacties definitief verwijderen?")) return;
      try { await api("verwijder", {id}); kies("flitsen"); } catch(e){ melding(document.getElementById("fmsg"), e.message, "fout"); }
    };
    document.getElementById("plaats").onclick = async () => {
      const label = document.querySelector('input[name="ulabel"]:checked')?.value;
      try {
        const n = await api("update", {flits:id, tekst:val("utekst"), label, bron:{naam:val("ubnaam"), url:val("uburl")}, push: document.getElementById("upush").checked});
        ["utekst","ubnaam","uburl"].forEach(i=>document.getElementById(i).value="");
        document.getElementById("tijdlijn").innerHTML = tijdlijnHTML(n); koppelTijdlijn(n);
        melding(document.getElementById("umsg"), "Update geplaatst." + (n.push?.verstuurd !== undefined ? ` Melding verstuurd naar ${n.push.verstuurd} ${n.push.verstuurd===1?"lezer":"lezers"}.` : ""));
      } catch(e){ melding(document.getElementById("umsg"), e.message, "fout"); }
    };
    koppelTijdlijn(f);
  }
  if(!id && STROOM.length){
    const lijst = document.getElementById("stroomlijst");
    const toon = q => {
      const n = q.toLowerCase();
      lijst.innerHTML = STROOM.filter(b=>!n || (b.titel+" "+b.bron).toLowerCase().includes(n)).slice(0,60)
        .map((b,i)=>`<button class="pick" data-i="${STROOM.indexOf(b)}">${esc(b.titel)}<small>${esc(b.bron)} · ${esc(b.label)} · ${fmt(b.tijd)}</small></button>`).join("") || `<p class="hint">Niets gevonden.</p>`;
    };
    toon("");
    document.getElementById("zoek").oninput = e => toon(e.target.value);
    lijst.onclick = e => {
      const p = e.target.closest(".pick"); if(!p) return;
      const b = STROOM[+p.dataset.i];
      set("titel", b.titel); set("bnaam", b.bron); set("blabel", b.label); set("burl", b.url);
      if(b.secties?.[0]) set("sectie", b.secties[0]);
      document.getElementById("titel").focus();
    };
  }
}
const val = id => document.getElementById(id)?.value ?? "";
const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };

function tijdlijnHTML(f){
  if(!f.updates.length) return `<p class="hint" style="margin:0">Nog geen updates.</p>`;
  return f.updates.map(u=>`<div class="update" data-u="${u.id}">
    <p class="meta">${fmt(u.tijd)}${u.bijgewerkt ? ` · bijgewerkt ${fmt(u.bijgewerkt)}` : ""}</p>
    <textarea data-f="tekst">${esc(u.tekst)}</textarea>
    <div class="row">
      <div><label>Label</label><select data-f="label">${Object.entries(LABELS).map(([k,v])=>`<option value="${k}" ${u.label===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div><label>Bron</label><input data-f="bnaam" value="${esc(u.bron?.naam)}"></div>
    </div>
    <label>Link</label><input data-f="burl" value="${esc(u.bron?.url)}">
    <div class="actions"><button class="btn small" data-a="opslaan">Wijziging opslaan</button><button class="btn ghost small" data-a="weg">Verwijderen</button></div>
  </div>`).join("");
}
function koppelTijdlijn(f){
  const box = document.getElementById("tijdlijn");
  box.onclick = async e => {
    const b = e.target.closest("button[data-a]"); if(!b) return;
    const el = b.closest(".update"), uid = el.dataset.u, g = k => el.querySelector(`[data-f="${k}"]`).value;
    try {
      let n;
      if(b.dataset.a==="weg"){ if(!confirm("Deze update verwijderen?")) return; n = await api("update-weg", {flits:f.id, id:uid}); }
      else n = await api("update", {flits:f.id, id:uid, tekst:g("tekst"), label:g("label"), bron:{naam:g("bnaam"), url:g("burl")}});
      box.innerHTML = tijdlijnHTML(n); koppelTijdlijn(n);
    } catch(err){ alert(err.message); }
  };
}

/* ---------- gesprekken ---------- */
const MODUS = {gemodereerd:"Gemodereerd", open:"Open", gesloten:"Gesloten"};
async function toonGesprekken(){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    const {ruimtes} = await api("ruimtes");
    let redNaam = "Redactie"; try { redNaam = localStorage.getItem("hag-rednaam") || "Redactie"; } catch(e) {}
    main.innerHTML = `<h1>Gesprekken</h1><p class="hint">Stel per ruimte in of berichten eerst langs jou gaan (gemodereerd), direct verschijnen (open) of niet meer kunnen (gesloten). Als redactie plaats je hier ook berichten; die krijgen in de app een rood label.</p>
      <div class="card"><label for="rednaam">Naam bij je redactieberichten</label><input id="rednaam" value="${esc(redNaam)}" maxlength="40"></div>
      ${ruimtes.map(r=>`<div class="card" data-ruimte="${esc(r.id)}">
        <h2 style="margin:0 0 4px">${esc(r.naam)}</h2><p class="meta">${esc(r.omschrijving)}</p>
        <label>Stand</label><select data-modus>${Object.entries(MODUS).map(([k,v])=>`<option value="${k}" ${r.modus===k?"selected":""}>${v}</option>`).join("")}</select>
        <label>Bericht als redactie</label><textarea data-tekst maxlength="2000" style="min-height:70px"></textarea>
        <div class="actions"><button class="btn small" data-a="plaats">Plaatsen</button><button class="btn ghost small" data-a="bekijk">Laatste berichten</button><a class="btn ghost small" href="/#ruimte-${esc(r.id)}" target="_blank">Bekijk in app</a></div>
        <div data-uit></div>
      </div>`).join("")}`;
    document.getElementById("rednaam").onchange = e => { try { localStorage.setItem("hag-rednaam", e.target.value); } catch(err) {} };
    main.onchange = async e => {
      const sel = e.target.closest("[data-modus]"); if(!sel) return;
      const c = sel.closest("[data-ruimte]");
      try { await api("ruimte-modus", {ruimte:c.dataset.ruimte, modus:sel.value}); melding(c.querySelector("[data-uit]"), "Stand opgeslagen."); }
      catch(err){ melding(c.querySelector("[data-uit]"), err.message, "fout"); }
    };
    main.onclick = async e => {
      const b = e.target.closest("button[data-a], button[data-weg]"); if(!b) return;
      const c = b.closest("[data-ruimte]"), uit = c.querySelector("[data-uit]"), ruimte = c.dataset.ruimte;
      try {
        if(b.dataset.weg){
          if(!confirm("Dit bericht verwijderen?")) return;
          await api("bericht-weg", {ruimte, id:b.dataset.weg}); b.closest(".update").remove(); return;
        }
        if(b.dataset.a==="plaats"){
          const ta = c.querySelector("[data-tekst]");
          await api("redactie-bericht", {ruimte, tekst:ta.value, naam:document.getElementById("rednaam").value});
          ta.value = ""; melding(uit, "Geplaatst.");
          return;
        }
        const {berichten} = await api("ruimte-berichten", {ruimte});
        uit.innerHTML = berichten.length ? berichten.slice().reverse().map(m=>`<div class="update"><p class="meta">${esc(m.naam)}${m.redactie?" (redactie)":""} · ${fmt(m.tijd)}</p><p class="quote">${esc(m.tekst)}</p><button class="btn ghost small" data-weg="${esc(m.id)}">Verwijderen</button></div>`).join("") : `<p class="hint">Nog geen berichten.</p>`;
      } catch(err){ melding(uit, err.message, "fout"); }
    };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- energie ---------- */
async function toonEnergie(){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    const e = await api("energie");
    const st = e.status ? Object.entries(e.status).map(([k,v]) => `<span class="tag ${v.ok ? "actief" : ""}">${esc(k)}: ${v.ok ? "ok" : esc(v.fout)}</span>`).join(" ") : "Nog niet opgehaald. Open de energiepagina in de app één keer.";
    main.innerHTML = `<h1>Energie</h1><p class="hint">Jouw duiding bij de energiemarkt. In de app staat die bovenaan de energiepagina en bij de bewegingen, met het label "Duiding van de redactie".</p>
      <div class="card"><label for="stand">Stand van de energiemarkt (één of twee zinnen)</label><textarea id="stand" maxlength="400">${esc(e.stand || "")}</textarea>
      <div class="actions"><button class="btn" id="bewaarstand">Opslaan</button></div><div id="smsg"></div></div>
      <h2>Opvallende bewegingen</h2>
      ${e.bewegingen.length ? e.bewegingen.map(b => `<div class="card" data-sleutel="${esc(b.sleutel)}">
        <p class="meta">${esc(b.datum)} · ${esc(b.naam || b.reeks)} · <strong>${b.pct>0?"+":""}${String(b.pct).replace(".",",")}%</strong> (van ${b.van} naar ${b.naar} ${esc(b.eenheid || "")})</p>
        <label>Duiding: wat dreef deze beweging volgens jou? (leeg laten = geen duiding)</label><textarea data-tekst maxlength="1500">${esc(b.duiding?.tekst || "")}</textarea>
        <div class="actions"><button class="btn small" data-bewaar>Opslaan</button></div><div data-uit></div>
      </div>`).join("") : `<div class="card"><p class="hint" style="margin:0">Geen opvallende bewegingen gevonden.</p></div>`}
      <h2>Bronnen</h2><div class="card"><p class="meta">Laatst opgehaald: ${e.bijgewerkt ? fmt(e.bijgewerkt) : "nog niet"}</p>${st}</div>`;
    document.getElementById("bewaarstand").onclick = async () => {
      try { await api("energie-duiding", {stand: val("stand")}); melding(document.getElementById("smsg"), "Opgeslagen."); }
      catch(err){ melding(document.getElementById("smsg"), err.message, "fout"); }
    };
    main.onclick = async ev => {
      const b = ev.target.closest("[data-bewaar]"); if(!b) return;
      const c = b.closest("[data-sleutel]");
      try { await api("energie-duiding", {sleutel:c.dataset.sleutel, tekst:c.querySelector("[data-tekst]").value}); melding(c.querySelector("[data-uit]"), "Opgeslagen."); }
      catch(err){ melding(c.querySelector("[data-uit]"), err.message, "fout"); }
    };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- agenda ---------- */
const STATUS = {officieel:"Officieel (organisator of alle partijen)", deels:"Aangekondigd door één partij", speculatie:"Speculatie (verwacht op basis van berichtgeving)"};
async function toonAgenda(bewerk){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    const {items} = await api("agenda");
    const i = bewerk ? items.find(x => x.id===bewerk) || {} : {};
    const sOpt = SECTIES.map(x => `<option value="${esc(x.id)}" ${x.id===i.sectie?"selected":""}>${esc(x.naam)}</option>`).join("");
    main.innerHTML = `<h1>Agenda</h1><p class="hint">Toppen, onderhandelingen en vaststaande momenten. Kies eerlijk het label: officieel alleen als de organisator of alle betrokken partijen het hebben aangekondigd.</p>
      <div class="card" id="agform"><h2 style="margin:0 0 6px">${bewerk ? "Punt bewerken" : "Nieuw punt"}</h2>
        <label for="atitel">Titel</label><input id="atitel" value="${esc(i.titel||"")}" maxlength="200">
        <div class="row"><div><label for="astart">Begindatum (of vermoedelijke datum)</label><input id="astart" type="date" value="${esc(i.start||"")}"></div><div><label for="aeind">Einddatum (optioneel)</label><input id="aeind" type="date" value="${esc(i.eind||"")}"></div></div>
        <div class="row"><div><label for="adtekst">Datum als tekst, als die niet vaststaat (bijv. "eind november")</label><input id="adtekst" value="${esc(i.datumTekst||"")}" maxlength="60"></div><div><label for="aplaats">Plaats</label><input id="aplaats" value="${esc(i.plaats||"")}" maxlength="80"></div></div>
        <div class="row"><div><label for="asectie">Sectie</label><select id="asectie">${sOpt}</select></div><div><label for="astatus">Label</label><select id="astatus">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${i.status===k?"selected":""}>${v}</option>`).join("")}</select></div></div>
        <label for="atoel">Toelichting: wie heeft wat aangekondigd, en wat is nog onzeker?</label><textarea id="atoel" maxlength="1500">${esc(i.toelichting||"")}</textarea>
        <div class="row"><div><label for="abnaam">Bron</label><input id="abnaam" value="${esc(i.bron?.naam||"")}"></div><div><label for="aburl">Link</label><input id="aburl" value="${esc(i.bron?.url||"")}" placeholder="https://"></div></div>
        <label class="vink"><input type="checkbox" id="apush"> Pushmelding sturen naar wie deze sectie volgt</label>
        <div class="actions"><button class="btn" id="abewaar">${bewerk ? "Opslaan" : "Toevoegen"}</button>${bewerk ? `<button class="btn ghost" id="anieuw">Nieuw punt</button><button class="btn ghost" id="aweg">Verwijderen</button>` : ""}</div><div id="amsg"></div>
      </div>
      <h2>Alle punten</h2>
      ${items.map(x => `<div class="card"><span class="tag ${x.status==="officieel"?"actief":""}">${esc(STATUS[x.status]?.split(" (")[0] || x.status)}</span><span class="meta">${esc(x.datumTekst || x.start)}${x.eind ? " t/m " + esc(x.eind) : ""} · ${esc(x.plaats||"")}</span>
        <h2 style="margin:6px 0 4px">${esc(x.titel)}</h2><div class="actions"><button class="btn small" data-bewerk="${esc(x.id)}">Bewerken</button></div></div>`).join("")}`;
    document.getElementById("abewaar").onclick = async () => {
      try {
        const r = await api("agenda-opslaan", {id:bewerk, titel:val("atitel"), start:val("astart"), eind:val("aeind"), datumTekst:val("adtekst"), plaats:val("aplaats"), sectie:val("asectie"), status:val("astatus"), toelichting:val("atoel"), bron:{naam:val("abnaam"), url:val("aburl")}, push:document.getElementById("apush").checked});
        await toonAgenda(r.id);
        melding(document.getElementById("amsg"), "Opgeslagen." + (r.push?.verstuurd !== undefined ? ` Melding verstuurd naar ${r.push.verstuurd} lezers.` : ""));
      } catch(e){ melding(document.getElementById("amsg"), e.message, "fout"); }
    };
    if(bewerk){
      document.getElementById("anieuw").onclick = () => toonAgenda();
      document.getElementById("aweg").onclick = async () => { if(!confirm("Dit punt verwijderen?")) return; await api("agenda-weg", {id:bewerk}); toonAgenda(); };
    }
    main.onclick = e => { const b = e.target.closest("[data-bewerk]"); if(b){ toonAgenda(b.dataset.bewerk); window.scrollTo(0,0); } };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- meldingen ---------- */
async function toonMeldingen(){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    const info = await api("push-info");
    main.innerHTML = `<h1>Meldingen</h1><p class="hint">${info.totaal} ${info.totaal===1?"lezer heeft":"lezers hebben"} meldingen aanstaan. Nieuwe artikelen gaan automatisch; bij flitsen en de agenda kies je het zelf met het vinkje. Hier stuur je een losse melding, bijvoorbeeld bij groot nieuws. Gebruik dit spaarzaam: te veel meldingen en lezers zetten ze uit.</p>
      <div class="card"><label>Naar wie?</label><div class="labels" id="pond">${info.onderwerpen.map(o => `<label><input type="checkbox" value="${esc(o.id)}"> ${esc(o.naam)} (${o.aantal})</label>`).join("")}</div>
      <label for="ptitel">Titel</label><input id="ptitel" maxlength="120">
      <label for="ptekst">Tekst</label><textarea id="ptekst" maxlength="240" style="min-height:70px"></textarea>
      <label for="purl">Waar gaat de melding heen? (bijv. /#flits-… of /#artikel-…, leeg = startpagina)</label><input id="purl" placeholder="/">
      <div class="actions"><button class="btn" id="pstuur">Versturen</button></div><div id="pmsg"></div></div>`;
    document.getElementById("pstuur").onclick = async () => {
      const ond = [...document.querySelectorAll("#pond input:checked")].map(i => i.value);
      if(!confirm("Deze melding nu versturen?")) return;
      try { const r = await api("push-handmatig", {onderwerpen:ond, titel:val("ptitel"), tekst:val("ptekst"), url:val("purl") || "/"}); melding(document.getElementById("pmsg"), r.fout ? r.fout : `Verstuurd naar ${r.verstuurd} van ${r.bereik} lezers.`, r.fout ? "fout" : "ok"); }
      catch(e){ melding(document.getElementById("pmsg"), e.message, "fout"); }
    };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- status en back-up ---------- */
async function toonStatus(){
  main.innerHTML = `<p class="hint">Status ophalen…</p>`;
  try {
    const s = await api("status");
    const oud = (iso, uren) => !iso || (Date.now() - new Date(iso)) / 36e5 > uren;
    const regel = (ok, titel, tekst) => `<div class="statusregel ${ok ? "ok" : "mis"}"><span class="stip"></span><div><strong>${titel}</strong><p class="meta">${tekst}</p></div></div>`;
    const bronnen = st => { if(!st) return ""; const mis = Object.entries(st).filter(([,v]) => !v.ok); return mis.length ? `Werkt niet: ${mis.map(([k,v]) => `${esc(v.naam || k)} (${esc(v.fout)})`).join(", ")}` : "Alle bronnen werken."; };
    const nOk = s.nieuws && !oud(s.nieuws.bijgewerkt, 1);
    const eOk = s.energie && !oud(s.energie.bijgewerkt, 7) && s.eiaSleutel;
    const aOk = s.artikelen && !s.artikelen.fout && !oud(s.artikelen.bijgewerkt, 3);
    const bOk = s.backup && !oud(s.backup, 24*8);
    main.innerHTML = `<h1>Status</h1><p class="hint">Of alle onderdelen van de app werken. Groen is in orde, rood vraagt aandacht.</p>
      <div class="card">
        ${regel(aOk, "Artikelen", s.artikelen?.fout ? "Niet bereikbaar: " + esc(s.artikelen.fout) : `${s.artikelen.aantal} artikelen, laatst bijgewerkt ${s.artikelen.bijgewerkt ? fmt(s.artikelen.bijgewerkt) : "onbekend"}. ${aOk ? "" : "De automatische update op GitHub lijkt niet te draaien: kijk bij Actions."}`)}
        ${regel(nOk, "Nieuwsstroom", s.nieuws ? `${s.nieuws.berichten} berichten en ${s.nieuws.vergelijkingen} bronvergelijkingen, bijgewerkt ${fmt(s.nieuws.bijgewerkt)}. ${bronnen(s.nieuws.bronnen)}` : "Nog niet opgehaald.")}
        ${regel(eOk, "Energie", s.energie ? `Bijgewerkt ${fmt(s.energie.bijgewerkt)}. ${s.eiaSleutel ? "" : "EIA_API_KEY ontbreekt in Netlify. "}${bronnen(s.energie.bronnen)}` : "Nog niet opgehaald. Open de energiepagina in de app één keer.")}
        ${regel(true, "Meldingen", `${s.meldingen.abonnees} ${s.meldingen.abonnees===1 ? "lezer heeft" : "lezers hebben"} meldingen aanstaan.`)}
        ${regel(true, "Agenda", `${s.agenda.komend} komende punten.`)}
        ${regel(s.wacht === 0, "Moderatie", s.wacht ? `${s.wacht} ${s.wacht===1 ? "reactie wacht" : "reacties wachten"} op je beoordeling.` : "Niets te beoordelen.")}
        ${regel(bOk, "Back-up", s.backup ? `Laatste back-up: ${fmt(s.backup)}.${bOk ? "" : " Dat is meer dan een week geleden: controleer de back-upwerkstroom op GitHub."}` : "Nog geen back-up gemaakt.")}
      </div>
      <h2>Back-up</h2>
      <div class="card">
        <p class="hint">Elke zondagnacht zet GitHub automatisch een versleutelde back-up in je repository (map <code>backups</code>). Hier maak je er ook zelf een, of zet je er een terug.</p>
        <div class="actions"><button class="btn" id="bdown">Back-up nu downloaden</button></div>
        <label for="bfile" style="margin-top:18px">Back-up terugzetten</label>
        <input type="file" id="bfile" accept="application/json,.json">
        <div class="actions"><button class="btn ghost" id="bherstel">Terugzetten</button></div>
        <div id="bmsg"></div>
      </div>`;
    document.getElementById("bdown").onclick = async () => {
      try {
        const r = await fetch("/api/backup", {headers:{"x-beheer":WW}}); if(!r.ok) throw new Error("Downloaden mislukt");
        const blob = await r.blob(), a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = `hag-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
        melding(document.getElementById("bmsg"), "Back-up gedownload.");
      } catch(e){ melding(document.getElementById("bmsg"), e.message, "fout"); }
    };
    document.getElementById("bherstel").onclick = async () => {
      const f = document.getElementById("bfile").files[0];
      if(!f){ melding(document.getElementById("bmsg"), "Kies eerst een back-upbestand.", "fout"); return; }
      if(!confirm("Weet je het zeker? Alles uit de back-up overschrijft wat er nu in de app staat.")) return;
      try { const r = await api("herstel", {bestand: JSON.parse(await f.text())}); melding(document.getElementById("bmsg"), `Teruggezet: ${r.items} onderdelen.`); }
      catch(e){ melding(document.getElementById("bmsg"), e.message, "fout"); }
    };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- uitlichten ---------- */
let ART = null;
async function toonUitlichten(keuze){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    if(!ART){ const r = await fetch("/api/artikelen"); ART = (await r.json()).articles || []; }
    const u = await api("uitgelicht");
    const opties = [...SECTIES, {id:"tech", naam:"Tech en AI"}].filter((x, i, a) => a.findIndex(y => y.id===x.id)===i);
    const sec = keuze || opties[0]?.id;
    const gekozen = (u[sec] || []).map(id => ART.find(a => a.id===id)).filter(Boolean);
    const titel = a => a.title + " (" + String(a.date).slice(0,10) + ")";
    main.innerHTML = `<h1>Uitlichten</h1><p class="hint">Kies per onderwerp maximaal zes van je eigen artikelen. Die staan in de app bovenaan bij dat onderwerp: in de nieuwsstroom, de bronvergelijking, bij flitsen en op de dossierpagina, en op de startpagina onder "Uitgelicht door de redactie".</p>
      <div class="card"><label for="usec">Onderwerp</label><select id="usec">${opties.map(o => `<option value="${esc(o.id)}" ${o.id===sec ? "selected" : ""}>${esc(o.naam)}</option>`).join("")}</select>
      <h2>Nu uitgelicht</h2>
      ${gekozen.length ? gekozen.map((a, i) => `<div class="update"><strong>${esc(titel(a))}</strong><div class="actions"><button class="btn ghost small" data-op="${i}">Omhoog</button><button class="btn ghost small" data-weg="${esc(a.id)}">Verwijderen</button></div></div>`).join("") : `<p class="hint">Nog niets uitgelicht bij dit onderwerp.</p>`}
      <h2>Artikel toevoegen</h2><input id="uzoek" placeholder="Zoek in je artikelen"><div class="list-scroll" id="ulijst" style="margin-top:8px"></div><div id="umsg2"></div></div>`;
    const bewaar = async ids => { try { await api("uitgelicht-zet", {sectie:sec, ids}); toonUitlichten(sec); } catch(e){ melding(document.getElementById("umsg2"), e.message, "fout"); } };
    const huidig = gekozen.map(a => a.id);
    document.getElementById("usec").onchange = e => toonUitlichten(e.target.value);
    const toon = q => { const n = q.toLowerCase(); document.getElementById("ulijst").innerHTML = ART.filter(a => !huidig.includes(a.id) && (!n || a.title.toLowerCase().includes(n))).slice(0, 40).map(a => `<button class="pick" data-voeg="${esc(a.id)}">${esc(a.title)}<small>${esc(String(a.date).slice(0,10))}${(a.dossiers || []).includes(sec) ? " · hoort bij dit onderwerp" : ""}</small></button>`).join("") || `<p class="hint">Niets gevonden.</p>`; };
    toon("");
    document.getElementById("uzoek").oninput = e => toon(e.target.value);
    main.onclick = e => {
      const v = e.target.closest("[data-voeg]"), w = e.target.closest("[data-weg]"), o = e.target.closest("[data-op]");
      if(v){ if(huidig.length >= 6){ melding(document.getElementById("umsg2"), "Maximaal zes artikelen per onderwerp.", "fout"); return; } bewaar([...huidig, v.dataset.voeg]); }
      if(w) bewaar(huidig.filter(id => id !== w.dataset.weg));
      if(o){ const i = +o.dataset.op; if(i > 0){ const l = [...huidig]; [l[i-1], l[i]] = [l[i], l[i-1]]; bewaar(l); } }
    };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}

/* ---------- moderatie ---------- */
async function toonModeratie(){
  main.innerHTML = `<p class="hint">Laden…</p>`;
  try {
    const {reacties} = await api("wachtrij");
    zetTeller(reacties.length);
    main.innerHTML = `<h1>Moderatie</h1><p class="hint">Reacties en berichten die op je goedkeuring wachten: bij een gemodereerde flits of ruimte, met een link of filterwoord, of na drie meldingen.</p>
      ${reacties.length ? reacties.map(r=>`<div class="card" data-r="${r.id}" data-f="${esc(r.flits || "")}" data-ruimte="${esc(r.ruimte || "")}">
        <p class="meta">${r.ruimte ? "Gesprek: " + esc(r.ruimteNaam) : "Flits: " + esc(r.flitsTitel)} · ${fmt(r.tijd)}${r.reden==="gemeld" ? ` · <strong style="color:var(--accent)">${r.meldingen}× gemeld</strong>` : ""}</p>
        <strong>${esc(r.naam)}</strong><p class="quote">${esc(r.tekst)}</p>
        <div class="actions"><button class="btn small" data-b="goedkeuren">Goedkeuren</button><button class="btn ghost small" data-b="verwijderen">Verwijderen</button></div>
      </div>`).join("") : `<div class="card"><p class="hint" style="margin:0">Niets te beoordelen.</p></div>`}`;
    main.onclick = async e => {
      const b = e.target.closest("button[data-b]"); if(!b) return;
      const c = b.closest(".card");
      try { await api("reactie", {flits:c.dataset.f, ruimte:c.dataset.ruimte || undefined, id:c.dataset.r, besluit:b.dataset.b}); c.remove(); zetTeller(main.querySelectorAll("[data-r]").length); }
      catch(err){ alert(err.message); }
    };
  } catch(e){ if(/Wachtwoord/.test(e.message)) toonLogin(e.message); else melding(main, e.message, "fout"); }
}
function zetTeller(n){ document.getElementById("wachtteller").textContent = n ? `(${n})` : ""; }

/* ---------- start ---------- */
async function start(){
  document.getElementById("nav").hidden = false;
  main.onclick = null;
  try {
    const r = await fetch("/api/nieuws"); const n = await r.json();
    SECTIES = n.secties || []; STROOM = n.berichten || [];
  } catch(e) {}
  if(!SECTIES.length) SECTIES = [{id:"oekraine",naam:"Oekraïne en Rusland"},{id:"iran",naam:"Iran en de Golf"},{id:"china",naam:"China en Azië-Pacific"},{id:"europa",naam:"Europa en Nederland"},{id:"vs",naam:"Amerikaanse macht"}];
  kies("status");
  api("wachtrij").then(r=>zetTeller(r.reacties.length)).catch(()=>{});
}
if(WW) api("controle").then(start).catch(e=>toonLogin()); else toonLogin();
</script>
